    const free = (await Store.players()).filter(p => !p.profile_id);
    this.sheet('اربط حسابك بلاعب', `
      <div class="note">اختر اسمك من اللاعبين الذين أضافتهم الإدارة، أو أنشئ لاعباً جديداً باسمك.</div>
      ${free.length ? free.map(p=>`<button class="pick" onclick="UI.claim('${p.id}')">
        ${this.av(p.name)}<div class="nm">${U.esc(p.name)}</div></button>`).join('')
        : '<div class="tiny dim center" style="margin:12px 0">لا يوجد لاعبون متاحون للربط.</div>'}
      <div class="sec"><h2>أو أنشئ لاعباً جديداً</h2><div class="rule"></div></div>
      <div class="row">
        <input class="input" id="np_name" placeholder="اسمك" style="flex:1"
          value="${U.esc(Store.profile?.display_name||'')}">
        <button class="btn solid" onclick="UI.createMine()">إنشاء</button>
      </div>
      <button class="btn full" style="margin-top:11px" onclick="UI.closeSheet()">لاحقاً</button>`);
  },
  async claim(id){
    try{ await Store.claimPlayer(id); this.closeSheet(); this.render(); this.toast('ارتبط حسابك','ok'); }
    catch(e){ this.toast(e.message,'err'); }
  },
  async createMine(){
    const n = document.getElementById('np_name').value.trim();
    if(!n) return this.toast('اكتب اسمك','err');
    try{ await Store.createMyPlayer(n); this.closeSheet(); this.render(); this.toast('تم إنشاء اللاعب','ok'); }
    catch(e){ this.toast(e.message,'err'); }
  },
  async signOut(){
    await Store.signOut(); this.closeSheet(); this.render(); this.toast('خرجت من حسابك');
  },

  /* ═══════════ الصفحات ═══════════ */

  trophyImg(n, cls){
    const i = Math.min(23, Math.max(1, Number(n) || 1)) - 1;
    return `<img src="${TROPHIES[i]}" alt="" class="${cls||''}" loading="lazy">`;
  },

  /* ملخّص بطولة — يُحسب من الذاكرة الشاملة بلا استعلام إضافي */
  async tSummary(t){
    const ms = await Store.matches(t.id);
    const en = await Store.entries(t.id);
    return Engine.summary(t, ms, en);
  },

  stateTag(sm){
    return sm.state === 'live' ? '<span class="tag win"><i class="dot"></i>جارية</span>'
         : sm.state === 'finished' ? '<span class="tag">مكتملة</span>'
         : '<span class="tag violet">قادمة</span>';
  },

  /* بطاقة بطولة — مختصرة عمداً: الوجهة هي صفحة البطولة */
  tCard(t, sm, PM){
    const isCup = t.kind === 'knockout';
    const facts = isCup
      ? `<span>المرحلة <b>${sm.stage || '—'}</b></span><span>المشاركون <b>${sm.players}</b></span>`
      : `<span>الجولة <b>${sm.round || '—'}</b></span><span>المشاركون <b>${sm.players}</b></span>
         <span>المباريات <b>${sm.played}/${sm.total}</b></span>`;
    const crown = sm.champion
      ? `<span class="tag gold">🏆 ${U.esc(PM[sm.champion]?.name || '')}</span>`
      : (!isCup && sm.leader ? `<span class="tag">المتصدر ${U.esc(sm.leader.name)}</span>` : '');

    return `<button class="tcard ${sm.state==='finished'?'done':''}" onclick="location.hash='#/t/${t.id}'">
      <div class="cup">${this.trophyImg(t.trophy)}</div>
      <div class="body">
        <div class="ttl">${U.esc(t.name)}</div>
        <div class="meta">
          <span class="tag">${isCup ? 'أدوار إقصائية' : 'دوري'}</span>
          ${this.stateTag(sm)}${crown}
        </div>
        <div class="facts">${facts}</div>
      </div>
      <div class="go">‹</div>
    </button>`;
  },

  /* صفحة بطولة واحدة — نوع البطولة يحدّد التبويبات المتاحة */
  async viewTournament(id){
    const t = await Store.tournament(id);
    if(!t) return `<div class="empty" style="margin-top:40px"><h3>البطولة غير موجودة</h3>
      <a class="btn" href="#/">كل البطولات</a></div>`;
    if(Store.db.meta.activeTournament !== id) await Store.setActiveTournament(id);

    const ms = await Store.matches(id);
    const ents = await Store.entries(id);
    const PM = await this.playersMap();
    const sm = Engine.summary(t, ms, ents);
    const isCup = t.kind === 'knockout';
    this.cacheRoundNames(t, ms);

    const tabs = isCup
      ? [['overview','نظرة عامة'],['knockout','الأدوار الإقصائية'],['matches','المباريات'],['stats','الإحصائيات']]
      : [['overview','نظرة عامة'],['standings','الترتيب'],['matches','المباريات'],['stats','الإحصائيات']];
    const cur = this.state.sub || 'overview';

    let h = `<div class="phead" style="align-items:center">
      <div class="cup" style="width:38px;height:46px;display:grid;place-items:center;flex-shrink:0">
        ${this.trophyImg(t.trophy)}</div>
      <div style="flex:1;min-width:0">
        <div class="tiny dim" style="font-weight:800">
          <a href="#/" style="color:var(--ink-3);text-decoration:none">البطولات</a> ›
          ${isCup ? 'أدوار إقصائية' : 'دوري'}</div>
        <h1 style="font-size:1.02rem">${U.esc(t.name)}</h1>
      </div>
      ${this.stateTag(sm)}
    </div>
    <div class="filters">
      ${tabs.map(([k,l])=>`<button class="fbtn ${k===cur?'on':''}"
        onclick="location.hash='#/t/${id}/${k}'">${l}</button>`).join('')}
    </div>`;

    if(!ms.length && cur !== 'overview')
      return h + (Store.isAdmin
        ? `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <a class="btn solid" href="#/admin">اذهب للإدارة</a></div>`
        : `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <p>يجهّز المشرفون المشاركين والمواعيد.</p></div>`);

    if(cur === 'standings')  return h + this.standingsHtml(t, ms, ents, PM);
    if(cur === 'knockout')   return h + this.knockoutHtml(t, ms, PM);
    if(cur === 'matches')    return h + this.tMatchesHtml(t, ms, PM);
    if(cur === 'stats')      return h + this.statsHtml(t, ms, ents, PM);
    return h + await this.overviewHtml(t, ms, ents, PM, sm);
  },

  /* نظرة عامة: حالة البطولة في لمحة — بلا جدول كامل ولا شجرة كاملة */
  async overviewHtml(t, ms, ents, PM, sm){
    const isCup = t.kind === 'knockout';
    const me = Store.me;
    const goals = ms.filter(m=>m.status==='completed')
      .reduce((x,m)=> x + Number(m.score_a||0) + Number(m.score_b||0), 0);

    let h = `<div class="card"><div class="kpis">
      <div class="kpi"><b class="num">${sm.players}</b><span>لاعب</span></div>
      <div class="kpi"><b class="num">${isCup ? (sm.stage||'—') : sm.round}</b>
        <span>${isCup?'المرحلة':'الجولة'}</span></div>
      <div class="kpi"><b class="num">${sm.played}/${sm.total}</b><span>لعبت</span></div>
      <div class="kpi"><b class="num">${goals}</b><span>هدف</span></div>
    </div></div>`;

    if(sm.champion){
      h += `<div class="card" style="text-align:center;padding:18px 14px;
        background:linear-gradient(150deg,var(--gold-soft),var(--bg-2));border-color:var(--gold-line)">
        <div style="height:88px;display:grid;place-items:center">${this.trophyImg(t.trophy)}</div>
        <div class="eyebrow" style="margin-top:6px">البطل</div>
        <div style="font-size:1.15rem;font-weight:900;color:var(--gold)">
          ${U.esc(PM[sm.champion]?.name||'')}</div>
      </div>`;
    }

    if(!ms.length){
      h += Store.isAdmin
        ? `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <p>حدّد المشاركين ثم ابنِ الجدول.</p>
             <a class="btn solid" href="#/admin">اذهب للإدارة</a></div>`
        : `<div class="empty"><h3>لم يُبنَ الجدول بعد</h3>
             <p>يجهّز المشرفون المشاركين والمواعيد.</p></div>`;
      return h;
    }

    if(!isCup && sm.leader){
      h += `<div class="sec"><h2>المتصدر</h2><div class="rule"></div>
        <a class="more" href="#/t/${t.id}/standings">الجدول</a></div>
      <div class="card" style="display:flex;align-items:center;gap:12px">
        ${this.av(sm.leader.name, sm.leader.id===me)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:.84rem">${U.esc(sm.leader.name)}</div>
          <div class="tiny dim">${sm.leader.pld} مباراة · ${sm.leader.w} فوز</div>
        </div>
        <div style="text-align:center"><div class="pts num" style="font-size:1.25rem">${sm.leader.pts}</div>
          <div class="tiny dim">نقطة</div></div>
      </div>`;
    }

    if(isCup && !sm.champion){
      const cur = ms.filter(m => m.round === sm.round);
      if(cur.length){
        h += `<div class="sec"><h2>${sm.stage}</h2><div class="rule"></div>
          <a class="more" href="#/t/${t.id}/knockout">المسار</a></div>
          ${cur.map(m=>this.board(m,PM)).join('')}`;
      }
    }

    const mine = me ? ms.filter(m => (m.player_a===me||m.player_b===me)
      && !['completed','cancelled'].includes(m.status))
      .sort((a,b)=> a.match_date.localeCompare(b.match_date))[0] : null;
    if(mine){
      h += `<div class="sec"><h2>مباراتي القادمة</h2><div class="rule"></div></div>${this.board(mine, PM)}`;
    }

    const needMe = me ? ms.filter(m => m.status==='pending_confirmation'
      && m.reported_by && m.reported_by !== me && (m.player_a===me||m.player_b===me)) : [];
    if(needMe.length){
      h += `<div class="sec"><h2>بانتظار تأكيدك</h2><div class="rule"></div>
        <span class="tag violet">${needMe.length}</span></div>
        ${needMe.map(m=>this.board(m,PM)).join('')}`;
    }
    return h;
  },

  /* الترتيب — جدول كامل، هو محور صفحة الدوري */
  standingsHtml(t, ms, ents, PM){
    const table = Engine.standings(ms, ents, t.points);
    const me = Store.me;
    return `<div class="card" style="padding:8px 10px">
      <table class="table">
        <thead><tr>
          <th>#</th><th>اللاعب</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th>
          <th>له</th><th>عليه</th><th>+/-</th><th>نقاط</th>
        </tr></thead>
        <tbody>
        ${table.map(r=>`<tr class="${r.id===me?'me':''}">
          <td class="rank ${r.rank<=3?'top':''} num">${r.rank}</td>
          <td><div class="pl">${this.av(r.name, r.id===me)}
            <div class="nm"><a href="#/player/${r.id}" style="color:inherit;text-decoration:none">${U.esc(r.name)}</a></div></div></td>
          <td class="num">${r.pld}</td><td class="num">${r.w}</td><td class="num">${r.d}</td><td class="num">${r.l}</td>
          <td class="num">${r.gf}</td><td class="num">${r.ga}</td>
          <td class="num" style="color:${r.gd>0?'var(--win)':r.gd<0?'var(--lose)':'var(--ink-3)'}"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></td>
          <td class="pts num">${r.pts}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="sec"><h2>الفورمة — آخر 5</h2><div class="rule"></div></div>
    <div class="card">
      ${table.map(r=>{
        const f = Engine.form(ms, r.id, 5).reverse();
        return `<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)">
          <div class="rank num dim">${r.rank}</div>
          <div class="nm" style="flex:1;font-size:.74rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(r.name)}</div>
          <span class="form">${f.length ? f.map(x=>`<i class="fchip ${x}">${x==='W'?'ف':x==='D'?'ت':'خ'}</i>`).join('')
            : '<i class="fchip N">—</i>'}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="note" style="margin-top:12px">كسر التعادل: النقاط ← فارق الأهداف ← الأهداف المسجلة ← المواجهة المباشرة.</div>`;
  },

  /* الأدوار الإقصائية — الشجرة هي العنصر البصري الرئيسي */
  knockoutHtml(t, ms, PM){
    const champ = Engine.champion(ms);
    let h = '';
    if(champ){
      h += `<div class="card" style="text-align:center;padding:16px 14px;margin-bottom:12px;
        background:linear-gradient(150deg,var(--gold-soft),var(--bg-2));border-color:var(--gold-line)">
        <div style="height:74px;display:grid;place-items:center">${this.trophyImg(t.trophy)}</div>
        <div class="eyebrow" style="margin-top:5px">البطل</div>
        <div style="font-size:1.1rem;font-weight:900;color:var(--gold)">${U.esc(PM[champ]?.name||'')}</div>
      </div>`;
    }
    h += this.treeHtml(ms, PM);
    const rounds = [...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);
    rounds.forEach(r => {
      const list = ms.filter(m=>m.round===r);
      const done = list.filter(m=>m.status==='completed').length;
      h += `<div class="sec" style="margin:16px 0 8px"><h2 style="font-size:.78rem">${Engine.roundLabel(r, ms)}</h2>
        <div class="rule"></div><span class="tag ${done===list.length?'win':''}">${done}/${list.length}</span></div>
        ${list.slice().sort((a,b)=>(a.slot||0)-(b.slot||0)).map(m=>this.board(m,PM)).join('')}`;
    });
    return h;
  },

  /* مباريات البطولة — بتصفّح الجولات */
  tMatchesHtml(t, ms, PM){
    const rounds = [...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);
    const cur = this.state.roundView || Engine.currentRound(ms);
    const list = ms.filter(m=>m.round===cur);
    return `<div class="rounds">
      ${rounds.map(r=>{
        const done = ms.filter(m=>m.round===r).every(m=>['completed','cancelled'].includes(m.status));
        const lbl = t.kind==='knockout' ? Engine.roundLabel(r, ms) : 'الجولة ' + r;
        return `<button class="rbtn ${r===cur?'on':''} ${done?'done':''}" onclick="UI.goRound(${r})">${lbl}</button>`;
      }).join('')}
    </div>${list.map(m=>this.board(m,PM)).join('')}`;
  },

  /* مركز المباريات — يجمع مباريات كل البطولات. المباراة هي العنصر الأساسي. */
  /* الإحصائيات العامة — كل اللاعبين عبر كل البطولات، قابلة للترتيب */
  async viewStats(){
    const players = await Store.players();
    const trns = await Store.tournaments();
    const rows = Engine.careerStats(players, trns, Store.allEntries(), Store.allMatches())
      .filter(r => r.trns > 0);

    if(!rows.length)
      return `<div class="phead"><h1>الإحصائيات</h1></div>
        <div class="empty" style="margin-top:26px"><h3>لا بيانات بعد</h3>
        <p>تظهر هنا بعد انطلاق أول بطولة.</p></div>`;

    const key = this.state.sk || 'pld';
    const cols = [
      ['name','اللاعب'],['trns','بطولات'],['titles','ألقاب'],['pld','لعب'],
      ['w','ف'],['d','ت'],['l','خ'],['gf','له'],['ga','عليه'],['gd','+/-']
    ];
    rows.sort((a,b)=> key==='name'
      ? a.name.localeCompare(b.name,'ar')
      : (key==='ga' ? a.ga-b.ga : b[key]-a[key]));

    const totals = rows.reduce((x,r)=>({ pld:x.pld+r.pld, gf:x.gf+r.gf }), {pld:0,gf:0});

    return `<div class="phead">
      <h1>الإحصائيات</h1>
      <div class="sub">${rows.length} لاعب</div>
    </div>
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><b class="num">${rows.length}</b><span>لاعب</span></div>
      <div class="kpi"><b class="num">${trns.length}</b><span>بطولة</span></div>
      <div class="kpi"><b class="num">${totals.pld/2|0}</b><span>مباراة</span></div>
      <div class="kpi"><b class="num">${totals.gf}</b><span>هدف</span></div>
    </div>
    <div class="tiny dim" style="margin-bottom:7px">اضغط على رأس العمود للترتيب، وعلى اللاعب لملفه.</div>
    <div class="card" style="padding:8px 10px">
      <table class="table sortable">
        <thead><tr>${cols.map(([k,l])=>
          `<th class="${k===key?'on':''}" onclick="UI.sortStats('${k}')">${l}</th>`).join('')}</tr></thead>
        <tbody>
        ${rows.map((r,i)=>`<tr class="${r.id===Store.me?'me':''}"
          onclick="location.hash='#/player/${r.id}'" style="cursor:pointer">
          <td style="text-align:right"><div class="pl">${this.av(r.name, r.id===Store.me)}
            <div class="nm">${U.esc(r.name)}</div></div></td>
          <td class="num">${r.trns}</td>
          <td class="num" style="color:${r.titles?'var(--gold)':'inherit'}">${r.titles || '—'}</td>
          <td class="num">${r.pld}</td><td class="num">${r.w}</td>
          <td class="num">${r.d}</td><td class="num">${r.l}</td>
          <td class="num" style="color:var(--gold)">${r.gf}</td>
          <td class="num" style="color:var(--lose)">${r.ga}</td>
          <td class="num"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="note" style="margin-top:12px">الأرقام مجمّعة من كل البطولات.
      المباريات المحسومة إدارياً تُحتسب في النتائج ولا تدخل في الأهداف.</div>`;
  },
  sortStats(k){ this.state.sk = k; this.render(); },

  /* ملف اللاعب العام — متاح للجميع لأن القراءة مفتوحة في القاعدة */
  async viewPlayer(id){
    const p = await Store.player(id);
    if(!p) return `<div class="empty" style="margin-top:40px"><h3>اللاعب غير موجود</h3>
      <a class="btn" href="#/stats">الإحصائيات</a></div>`;
    const players = await Store.players();
    const trns = await Store.tournaments();
    const PM = await this.playersMap();
    const r = Engine.careerStats(players, trns, Store.allEntries(), Store.allMatches())
      .find(x => x.id === id);
    const mine = Store.matchesOf(id).filter(m => m.status === 'completed')
      .sort((a,b)=> (b.result_at||'').localeCompare(a.result_at||'')).slice(0, 8);
    const myTrns = Store.tournamentsOf(id);
    const TN = {}; trns.forEach(t => TN[t.id] = t);

    let h = `<div class="phead" style="align-items:center">
      ${this.av(p.name, p.id===Store.me)}
      <div style="flex:1;min-width:0">

          <a href="#/stats" style="color:var(--ink-3);text-decoration:none">الإحصائيات</a> › لاعب</div>
        <h1 style="font-size:1.02rem">${U.esc(p.name)}</h1>
      </div>
    </div>`;

    if(p.game_id) h += `<div class="row tight" style="margin-bottom:12px">
      <span class="tag gold" dir="ltr">${U.esc(p.game_id)}</span>${this.plat(p.platform)}</div>`;

    h += `<div class="card"><div class="kpis">
      <div class="kpi"><b class="num">${r.pld}</b><span>مباراة</span></div>
      <div class="kpi"><b class="num" style="color:var(--win)">${r.w}</b><span>فوز</span></div>
      <div class="kpi"><b class="num">${r.d}</b><span>تعادل</span></div>
      <div class="kpi"><b class="num" style="color:var(--lose)">${r.l}</b><span>خسارة</span></div>
    </div>
    <div class="kpis" style="margin-top:7px">
      <div class="kpi"><b class="num" style="color:var(--gold)">${r.gf}</b><span>له</span></div>
      <div class="kpi"><b class="num" style="color:var(--lose)">${r.ga}</b><span>عليه</span></div>
      <div class="kpi"><b class="num"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></b><span>فارق</span></div>

    if(r.titles){
      const won = trns.filter(t => Engine.titleHolder(t,

          .map(e=>({...e, player: players.find(pp=>pp.id===e.player_id)})).filter(e=>e.player)) === id);
      h += `<div class="sec"><h2>الألقاب</h2><div class="rule"></div>
        <span class="tag gold">${r.titles}</span></div>`;
      h += won.map(t=>`<button class="tcard" onclick="location.hash='#/t/${t.id}'">
        <div class="cup">${this.trophyImg(t.trophy)}</div>
        <div class="body"><div class="ttl">${U.esc(t.name)}</div>

  async viewMatchCenter(){
    const all = await Store.tournaments();
    const TN = {}; all.forEach(t => TN[t.id] = t);
    const PM = await this.playersMap();
    const today = U.today();
    const f = this.state.mf || 'all';

    let ms = Store.allMatches().filter(m => m.status !== 'cancelled');
    if(f === 'today')  ms = ms.filter(m => m.match_date === today);
    if(f === 'next')   ms = ms.filter(m => !['completed'].includes(m.status) && m.match_date >= today);
    if(f === 'done')   ms = ms.filter(m => m.status === 'completed');
    if(f === 'mine' && Store.me)
      ms = ms.filter(m => m.player_a === Store.me || m.player_b === Store.me);

    const asc = f === 'done' ? -1 : 1;
    ms.sort((a,b)=> asc * ((a.match_date+a.match_time).localeCompare(b.match_date+b.match_time)));

    const counts = {
      all: Store.allMatches().filter(m=>m.status!=='cancelled').length,
      today: Store.allMatches().filter(m=>m.match_date===today && m.status!=='cancelled').length,
      done: Store.allMatches().filter(m=>m.status==='completed').length
    };

    let h = `<div class="phead">
      <h1>المباريات</h1>
      <div class="sub">${counts.all} مباراة في ${all.length} بطولة</div>
    </div>
    <div class="filters">
      ${[['all','الكل',counts.all],['today','اليوم',counts.today],
         ['next','القادمة',''],['done','النتائج',counts.done],
         ...(Store.me ? [['mine','مبارياتي','']] : [])]
        .map(([k,l,c])=>`<button class="fbtn ${k===f?'on':''}" onclick="UI.mfilter('${k}')">
          ${l}${c!=='' ? `<i>${c}</i>` : ''}</button>`).join('')}
    </div>`;

    if(!ms.length)
      return h + `<div class="empty" style="margin-top:26px"><h3>لا مباريات هنا</h3>
        <p>جرّب تصفية أخرى.</p></div>`;

    /* خط زمني حسب التاريخ */
    const days = [];
    ms.forEach(m => {
      const d = days.find(x => x.d === m.match_date);
      if(d) d.list.push(m); else days.push({ d:m.match_date, list:[m] });
    });

    days.forEach(day => {
      h += `<div class="daybar"><b>${U.fmtDate(day.d)}</b>
        <div class="ln"></div><span class="cnt">${day.list.length} مباراة</span></div>`;
      h += day.list.map(m => {
        const t = TN[m.tournament_id];
        const isCup = t?.kind === 'knockout';
        const done = m.status === 'completed';
        const st = CFG.STATUS[m.status];
        const rn = isCup ? '' : 'الجولة ' + m.round;
        return `<button class="mcard" onclick="location.hash='#/match/${m.id}'">
          <div style="flex:1;min-width:0">
            <div class="trn">${U.esc(t?.name||'')}${rn ? ' · ' + rn : ''}</div>
            <div class="who">${U.esc(PM[m.player_a]?.name || 'بانتظار الفائز')}</div>
            <div class="who">${U.esc(PM[m.player_b]?.name || 'بانتظار الفائز')}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
            <div class="rs ${done ? '' : 'soon'}">${done
              ? `${m.score_a} <span class="dim">–</span> ${m.score_b}`
              : (m.player_a && m.player_b ? U.fmtTime(m.match_time) : '—')}</div>
            <span class="tag ${st.cls}" style="font-size:.52rem;padding:2px 7px">
              ${m.status==='live'?'<i class="dot pulse"></i>':''}${st.ar}</span>
          </div>
        </button>`;
      }).join('');
    });
    return h;
  },

  async viewTournaments(){
    const all = await Store.tournaments();
    const PM = await this.playersMap();
    const sms = {};
    for(const t of all) sms[t.id] = await this.tSummary(t);

    const live = all.filter(t => sms[t.id].state === 'live');
    const soon = all.filter(t => sms[t.id].state === 'upcoming');
    const done = all.filter(t => sms[t.id].state === 'finished');

    let h = `<div class="phead">
      <h1>البطولات</h1>
      <div class="sub">${all.length} بطولة</div>
      ${Store.isAdmin ? `<button class="btn sm solid act" onclick="UI.tournamentForm()">بطولة جديدة</button>` : ''}
    </div>`;

    if(!all.length){
      return h + (Store.isAdmin
        ? `<div class="empty" style="margin-top:30px"><h3>لا توجد بطولات</h3>
             <p>أنشئ أول بطولة لتبدأ.</p>
             <button class="btn solid" onclick="UI.tournamentForm()">بطولة جديدة</button></div>`
        : this.waiting('لم ينطلق الدوري بعد',
            'ما إن يعلن المشرفون عن البطولة حتى تظهر هنا.', 'tournament'));
    }

    h += `<div class="kpis" style="margin-bottom:6px">
      <div class="kpi"><b class="num">${live.length}</b><span>جارية</span></div>
      <div class="kpi"><b class="num">${soon.length}</b><span>قادمة</span></div>
      <div class="kpi"><b class="num">${done.length}</b><span>مكتملة</span></div>
      <div class="kpi"><b class="num">${Store.allMatches().length}</b><span>مباراة</span></div>
    </div>`;

    h += await this.joinSection();

    const league = all.filter(t => t.kind !== 'knockout');
    const cup    = all.filter(t => t.kind === 'knockout');
    const ord = x => ({live:0, upcoming:1, finished:2})[sms[x.id].state];

    if(league.length){
      h += `<div class="sec"><h2>بطولات الدوري</h2><div class="rule"></div>
        <span class="tag">${league.length}</span></div>`;
      h += league.slice().sort((a,b)=>ord(a)-ord(b))
        .map(t => this.tCard(t, sms[t.id], PM)).join('');
    }
    if(cup.length){
      h += `<div class="sec"><h2>بطولات الأدوار الإقصائية</h2><div class="rule"></div>
        <span class="tag">${cup.length}</span></div>`;
      h += cup.slice().sort((a,b)=>ord(a)-ord(b))
        .map(t => this.tCard(t, sms[t.id], PM)).join('');
    }

    /* معاينة مختصرة لأقرب المباريات — لا بطاقات كاملة */
    const today = U.today();
    const soonest = Store.allMatches()
      .filter(m => !['completed','cancelled'].includes(m.status) && m.player_a && m.player_b)
      .sort((a,b)=> (a.match_date+a.match_time).localeCompare(b.match_date+b.match_time))
      .slice(0, 3);
    if(soonest.length){
      const TN = {}; all.forEach(t => TN[t.id] = t.name);
      h += `<div class="sec"><h2>أقرب المباريات</h2><div class="rule"></div>
        <a class="more" href="#/matches">مركز المباريات</a></div>
      <div class="card" style="padding:4px 12px">
        ${soonest.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;
          border-bottom:1px solid var(--line)">
          <div style="flex:1;min-width:0">
            <div class="tiny" style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
              ${U.esc(PM[m.player_a]?.name||'')} <span class="dim">×</span> ${U.esc(PM[m.player_b]?.name||'')}</div>
            <div class="tiny dim" style="font-size:.58rem">${U.esc(TN[m.tournament_id]||'')}</div>
          </div>
          <span class="tag">${m.match_date===today ? U.fmtTime(m.match_time) : U.fmtDate(m.match_date)}</span>
        </div>`).join('')}
      </div>`;
    }
    return h;
  },

  /* رسم شجرة البطولة — الأعمدة من اليمين (الدور الأول) إلى اليسار (الكأس) */
  treeHtml(ms, PM){
    const sh = Engine.treeShape(ms);
    if(!sh) return '';
    const champ = Engine.champion(ms);
    const me = Store.me;

    const side = (pid, gf, isW, isL, pens) => {
      const p = PM[pid];
      return `<div class="tr-s ${isW?'w':''} ${isL?'lo':''} ${p?'':'tbd'}">
        <span class="n">${p ? U.esc(p.name) : '—'}${p && p.id===me ? ' •' : ''}</span>
        <span class="g">${gf==null ? '' : gf}${pens!=null?`<sub style="font-size:.5rem">(${pens})</sub>`:''}</span>
      </div>`;
    };

    const cols = sh.cols.map((col, ci) => {
      const cells = col.cells.map((cell, i) => {
        const pos = ci < sh.cols.length - 1 ? (i % 2 === 0 ? 'up' : 'dn') : '';
        if(cell.type === 'bye'){
          return `<div class="tr-cell ${pos}">
            <div class="tr-m bye">
              <div class="tr-tag">عبور مباشر</div>
              ${side(cell.player, null, false, false)}
            </div></div>`;
        }
        const m = cell.m;
        const w = Engine.winnerOf(m);
        const done = m.status === 'completed';
        return `<div class="tr-cell ${pos}">
          <div class="tr-m ${m.status==='live'?'live':''}" onclick="location.hash='#/match/${m.id}'">
            <div class="tr-tag">${done ? (m.result_type==='normal'?'انتهت':'قرار')
              : m.status==='live' ? 'تُلعب الآن'
              : m.status==='disputed' ? 'نزاع'
              : m.status==='pending_confirmation' ? 'بانتظار التأكيد'
              : U.fmtDate(m.match_date)}</div>
            ${side(m.player_a, m.score_a, done && w===m.player_a, done && w && w!==m.player_a, m.pen_a)}
            ${side(m.player_b, m.score_b, done && w===m.player_b, done && w && w!==m.player_b, m.pen_b)}
          </div></div>`;
      }).join('');
      return `<div class="tr-col"><div class="tr-head">${col.name}</div>
        <div class="tr-body">${cells}</div></div>`;
    }).join('');

    const cup = `<div class="tr-cup">
      <div class="ic">🏆</div>
      <div class="lb">${champ ? 'البطل' : 'الكأس'}</div>
      ${champ ? `<div class="nm">${U.esc(PM[champ]?.name||'')}</div>`
              : `<div class="nm" style="color:var(--ink-3);font-weight:700;font-size:.62rem">
                   بانتظار النهائي</div>`}
    </div>`;

    return `<div class="tree"><div class="tree-in">${cols}${cup}</div></div>
      ${sh.rounds > 2 ? '<div class="tr-hint">اسحب أفقياً لتصفّح الأدوار</div>' : ''}`;
  },


  tab(v){ this.state.tab = v; this.render(); },

  /* رسم بياني شريطي — بلا مكتبات، يقرأ على الجوال */
  chart(title, rows, opt){
    const o = opt || {};
    if(!rows.length) return '';
    const max = Math.max(...rows.map(r => Math.abs(r.v)), 1);
    return `<div class="sec"><h2>${title}</h2><div class="rule"></div>
      ${o.note?`<span class="tag">${o.note}</span>`:''}</div>
    <div class="card">${rows.map(r => `
      <div class="barrow">
        <div class="nm">${U.esc(r.name)}</div>
        <div class="bartrack">
          <div class="barfill ${o.tone||''}" style="width:${Math.max(3, Math.abs(r.v)/max*100)}%"></div>
        </div>
        <div class="v ${o.tone||''}">${r.t != null ? r.t : r.v}</div>
      </div>`).join('')}</div>`;
  },

  statsHtml(t, ms, ents, PM){
    const st = Engine.playerStats(ms, ents).filter(r => r.pld > 0);

    let h = '';
    if(!st.length)
      return h + `<div class="empty" style="margin-top:30px"><h3>لا إحصائيات بعد</h3>
        <p>تظهر هنا فور اعتماد أول نتيجة.</p></div>`;

    const goals = st.reduce((x,r)=> x + r.gf, 0);
    const played = ms.filter(m=>m.status==='completed').length;
    h += `<div class="card" style="margin-bottom:4px"><div class="kpis">
      <div class="kpi"><b class="num">${played}</b><span>مباراة</span></div>
      <div class="kpi"><b class="num">${goals}</b><span>هدف</span></div>
      <div class="kpi"><b class="num">${played?(goals/played).toFixed(1):'0'}</b><span>معدل المباراة</span></div>
      <div class="kpi"><b class="num">${st.length}</b><span>لاعب</span></div>
    </div></div>`;

    const by = (f, dir) => st.slice().sort((a,b)=> dir==='asc' ? a[f]-b[f] : b[f]-a[f]);

    h += this.chart('الأهداف المسجّلة',
      by('gf').map(r=>({name:r.name, v:r.gf})), {note:'أقوى هجوم'});

    h += this.chart('الأهداف المستقبَلة',
      by('ga','asc').map(r=>({name:r.name, v:r.ga})), {tone:'red', note:'أقوى دفاع أولاً'});

    h += this.chart('فارق الأهداف',
      by('gd').map(r=>({name:r.name, v:r.gd,
        t:`<span class="sgn">${r.gd>0?'+':''}${r.gd}</span>`})));

    h += this.chart('نسبة الفوز',
      by('winPct').map(r=>({name:r.name, v:r.winPct, t:Math.round(r.winPct)+'%'})));

    h += this.chart('متوسط التسجيل',
      by('avgFor').map(r=>({name:r.name, v:r.avgFor, t:r.avgFor.toFixed(2)})),
      {note:'هدف لكل مباراة'});

    h += this.chart('متوسط الاستقبال',
      by('avgAgainst','asc').map(r=>({name:r.name, v:r.avgAgainst, t:r.avgAgainst.toFixed(2)})),
      {tone:'red'});

    const cs = by('clean').filter(r=>r.clean>0);
    if(cs.length) h += this.chart('الشباك النظيفة',
      cs.map(r=>({name:r.name, v:r.clean})), {tone:'dim'});

    const sk = by('streak').filter(r=>r.streak>1);
    if(sk.length) h += this.chart('أطول سلسلة انتصارات',
      sk.map(r=>({name:r.name, v:r.streak, t:r.streak+' متتالية'})));

    /* جدول تفصيلي لكل لاعب */
    h += `<div class="sec"><h2>التفاصيل الكاملة</h2><div class="rule"></div></div>
    <div class="card" style="padding:8px 10px">
      <table class="table"><thead><tr>
        <th>اللاعب</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th>

  /* ── صفحة المباراة: دورة الحياة الكاملة ── */
  async viewMatch(id){
    const m = await Store.match(id);
    if(!m) return `<div class="empty"><h3>المباراة غير موجودة</h3><p>ربما حُذفت البطولة.</p><a class="btn" href="#/matches">كل المباريات</a></div>`;

    const PM = await this.playersMap();
    const A = PM[m.player_a], B = PM[m.player_b];
    const me = Store.me, adm = Store.isAdmin;
    const isMine = me === m.player_a || me === m.player_b;
    const opp = me === m.player_a ? m.player_b : m.player_a;
    const st = CFG.STATUS[m.status];
    this._evd = (m.score_a != null) ? await Store.evidence(m.id) : [];

    const ms0 = await Store.matches(m.tournament_id);
    this.cacheRoundNames(t, ms0);
    const rname = t.kind === 'knockout'
      ? Engine.roundLabel(m.round, ms0)
      : `الجولة ${m.round}`;

    let h = `<div class="sec" style="margin-top:4px">
      <a class="more" href="#/matches" style="font-size:.7rem">‹ المباريات</a>
      <div class="rule"></div><span class="tag">${rname}</span></div>`;

    if(!m.player_a || !m.player_b){
      h += `<div class="note">تُحدَّد أطراف هذه المباراة بعد انتهاء الدور السابق.</div>`;

    /* اللوحة */
    h += `<div class="card" style="text-align:center;background:linear-gradient(150deg,var(--surface),var(--bg-2))">

        <div style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${this.av(A?.name, A?.id===me)}</div>
          <div style="font-size:.76rem;font-weight:800">${U.esc(A?.name||'—')}</div>
          ${A?.game_id?`<div class="tiny dim" dir="ltr">${U.esc(A.game_id)}</div>`:''}
        </div>
        <div class="score" style="font-size:1.7rem;min-width:96px">
          ${m.score_a==null ? '<span class="dim" style="font-size:1rem">—</span>' : `${m.score_a} <span class="dim">–</span> ${m.score_b}`}
        </div>
        <div style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${this.av(B?.name, B?.id===me)}</div>
          <div style="font-size:.76rem;font-weight:800">${U.esc(B?.name||'—')}</div>
          ${B?.game_id?`<div class="tiny dim" dir="ltr">${U.esc(B.game_id)}</div>`:''}
        </div>
      </div>
      <div class="tiny dim" style="margin-top:12px">${U.fmtDate(m.match_date)} · ${U.fmtTime(m.match_time)}</div>
      ${m.result_type==='walkover' ? `<div class="tag" style="margin-top:8px">فوز بالانسحاب</div>` : ''}
      ${m.result_type==='decision' ? `<div class="tag" style="margin-top:8px">

    /* الدردشة — لطرفَي المباراة والمشرف فقط */

      h += `<div class="sec"><h2>الدردشة</h2><div class="rule"></div></div>${this.chatBox(m, isMine)}`;

    /* حضور اللاعبين */
    if(['scheduled','live'].includes(m.status)){
      h += `<div class="sec"><h2>حضور اللاعبين</h2><div class="rule"></div></div>
      <div class="card">
        <div style="display:flex;gap:10px">
          ${[[m.player_a,'attend_a'],[m.player_b,'attend_b']].map(([pid,key])=>`

            ${isMine||adm?`<button class="btn sm" style="margin-top:8px" onclick="UI.setStatus('${m.id}','live')">ابدأ المباراة</button>`:''}</div>` : ''}

      h += `<div class="sec"><h2>تسجيل النتيجة</h2><div class="rule"></div></div>

        <div class="entry">
          <div>

              <button onclick="UI.step('sa',1)">+</button>
              <input class="num" id="sa" type="number" inputmode="numeric" min="0" max="99" value="0" oninput="UI.penToggle()">
              <button onclick="UI.step('sa',-1)">−</button>
            </div>
          </div>
          <div class="vs">VS</div>
          <div>
            <div class="who">${U.esc(B?.name||'—')}</div>
            <div class="stepper">
              <button onclick="UI.step('sb',1)">+</button>
              <input class="num" id="sb" type="number" inputmode="numeric" min="0" max="99" value="0" oninput="UI.penToggle()">
              <button onclick="UI.step('sb',-1)">−</button>
            </div>
          </div>
        </div>
        ${t.kind === 'knockout' ? `
        <div id="pens" style="display:none;margin-top:11px">
          <div class="note warn">لا تعادل في الكأس — أدخل ركلات الترجيح.</div>
          <div class="entry">
            <div><div class="who">${U.esc(A?.name||'—')}</div>
              <div class="stepper"><button onclick="UI.step('pa',1)">+</button>
              <input class="num" id="pa" type="number" inputmode="numeric" min="0" value="0">
              <button onclick="UI.step('pa',-1)">−</button></div></div>
            <div class="vs">ركلات</div>
            <div><div class="who">${U.esc(B?.name||'—')}</div>
              <div class="stepper"><button onclick="UI.step('pb',1)">+</button>
              <input class="num" id="pb" type="number" inputmode="numeric" min="0" value="0">
              <button onclick="UI.step('pb',-1)">−</button></div></div>
          </div>
        </div>` : ''}
        <div class="field" style="margin-top:12px">
          <label>إثبات النتيجة <span class="dim">(اختياري)</span></label>
          <input class="input" type="file" accept="image/*" id="evd" onchange="UI.pickEvidence(event)">
          <div class="evd" id="evdprev"></div>
        </div>
        <button class="btn solid full" onclick="UI.report('${m.id}')">سجّل النتيجة</button>
        <div class="tiny dim center" style="margin-top:8px">تُرسل للخصم للموافقة قبل اعتمادها في الجدول.</div>
      </div>`;
    }

    /* تأكيد الخصم */
    if(m.status === 'pending_confirmation'){
      const reporter = PM[m.reported_by];
      const iMustConfirm = isMine && m.reported_by !== me;
      h += `<div class="sec"><h2>تأكيد النتيجة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="note violet">سجّل <b>${U.esc(reporter?.name||'—')}</b> النتيجة ${m.score_a} – ${m.score_b}
          ${m.reported_at?`<div class="tiny dim" style="margin-top:4px">${U.fmtStamp(m.reported_at)}</div>`:''}</div>
        ${this.evidenceHtml()}
        ${iMustConfirm ? `
          <div class="row" style="margin-top:11px">
            <button class="btn ok" style="flex:1" onclick="UI.confirm('${m.id}')">أوافق</button>
            <button class="btn danger" style="flex:1" onclick="UI.disputeSheet('${m.id}')">أعترض</button>
          </div>`
        : `<div class="tiny dim center" style="margin-top:10px">
            بانتظار موافقة ${U.esc(PM[m.reported_by===m.player_a?m.player_b:m.player_a]?.name||'الخصم')}.
          </div>
          ${adm?`<button class="btn full" style="margin-top:10px" onclick="UI.confirm('${m.id}',true)">اعتماد إداري</button>`:''}`}
      </div>`;
    }

    /* نزاع */
    if(m.status === 'disputed'){
      h += `<div class="sec"><h2>نزاع على المباراة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="note warn">اللاعبان سجّلا نتيجتين مختلفتين. القرار للإدارة.</div>
        <div class="row" style="gap:9px">
          ${[['reported','النتيجة الأولى',m.score_a,m.score_b,m.reported_by],
             ['claim','اعتراض الخصم',m.claim_a,m.claim_b,m.claim_by]].map(([k,lbl,x,y,by])=>`
            <div style="flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center">
              <div class="tiny dim" style="font-weight:800">${lbl}</div>
              <div class="num" style="font-size:1.2rem;font-weight:800;margin:4px 0">${x} – ${y}</div>
              <div class="tiny dim">${U.esc(PM[by]?.name||'—')}</div>
              ${adm?`<button class="btn sm" style="margin-top:7px" onclick="UI.resolve('${m.id}','${k}')">اعتماد</button>`:''}
            </div>`).join('')}
        </div>
        ${this.evidenceHtml()}
        ${adm?`<div class="row" style="margin-top:11px">
          <button class="btn" style="flex:1" onclick="UI.replay('${m.id}')">إعادة المباراة</button>
          <button class="btn danger" style="flex:1" onclick="UI.setStatus('${m.id}','cancelled')">إلغاء</button>
        </div>`:`<div class="tiny dim center" style="margin-top:10px">بانتظار قرار الإدارة.</div>`}
      </div>`;
    }

    /* مكتملة */
    if(m.status === 'completed'){
      const w = Engine.winnerOf(m);
      h += `<div class="card">
        ${t.kind === 'knockout' && w ? `<div class="tag gold" style="margin-bottom:9px">
          🏆 تأهّل ${U.esc(PM[w]?.name||'')}</div>` : ''}
        <div class="tiny dim">اعتُمدت ${U.fmtStamp(m.confirmed_at)}${m.confirmed_by_admin?' — بقرار إداري':''}</div>
        ${this.evidenceHtml()}
        ${adm?`<button class="btn full" style="margin-top:11px" onclick="UI.reopen('${m.id}')">إعادة فتح النتيجة</button>`:''}

    /* التأجيل */
    if(!['completed','cancelled'].includes(m.status)){

      if(m.postpone && !m.postpone.agreed){
        const byMe = m.postpone.by === me;
        h += `<div class="note">طلب <b>${U.esc(PM[m.postpone.by]?.name||'—')}</b> التأجيل إلى
          ${U.fmtDate(m.postpone.date)} ${U.fmtTime(m.postpone.time)}</div>`;
        if(isMine && !byMe)
          h += `<div class="row"><button class="btn ok" style="flex:1" onclick="UI.agreePostpone('${m.id}')">أوافق على التأجيل</button>
                <button class="btn danger" style="flex:1" onclick="UI.rejectPostpone('${m.id}')">أرفض</button></div>`;
        else h += `<div class="tiny dim center">بانتظار موافقة الخصم.</div>`;
        if(adm) h += `<button class="btn full" style="margin-top:9px" onclick="UI.agreePostpone('${m.id}',true)">تأجيل إداري</button>`;
      } else if(isMine || adm){
        h += `<button class="btn full" onclick="UI.postponeSheet('${m.id}')">اطلب تأجيل المباراة</button>
              <div class="tiny dim center" style="margin-top:7px">يُنفَّذ فوراً عند موافقة الطرفين.</div>`;
      } else {
        h += `<div class="tiny dim center">لا توجد طلبات تأجيل.</div>`;
      }
      h += `</div>`;
    }

    /* إجراءات الإدارة */
    if(adm){
      h += `<div class="sec"><h2>إجراءات الإدارة</h2><div class="rule"></div></div>
      <div class="card"><div class="row tight">
        <button class="btn sm" onclick="UI.walkoverSheet('${m.id}')">حسم إداري</button>
        <button class="btn sm" onclick="UI.rescheduleSheet('${m.id}')">تعديل الموعد</button>
        ${m.status!=='cancelled'?`<button class="btn sm danger" onclick="UI.setStatus('${m.id}','cancelled')">إلغاء المباراة</button>`:
          `<button class="btn sm" onclick="UI.replay('${m.id}')">إعادة تفعيل</button>`}
      </div></div>`;
    }

    /* سجل المباراة */
    const logs = await Store.auditLog(m.tournament_id, m.id);
    if(logs.length){
      h += `<div class="sec"><h2>سجل المباراة</h2><div class="rule"></div></div>
      <div class="card">${logs.map(l=>`<div class="log">
        <time>${U.fmtStamp(l.created_at)}</time>
        <div><b>${U.esc(l.actor_name)}</b> — ${U.esc(l.action)}${l.detail?` <span class="dim">${U.esc(l.detail)}</span>`:''}</div>
      </div>`).join('')}</div>`;
    }
    return h;
  },

  _evd: [],
  /* ── دردشة المباراة ── */
  chatState(m){
    if(m.status === 'cancelled') return { open:false, why:'ملغاة' };
    if(['live','pending_confirmation','disputed'].includes(m.status)) return { open:true };
    if(m.status === 'completed'){
      const end = m.confirmed_at ? new Date(m.confirmed_at).getTime() + 7200000 : 0;
      return Date.now() < end
        ? { open:true, closing:U.mins(end - Date.now()) }
        : { open:false, why:'انتهت' };
    }
    const opensAt = U.matchMoment(m).getTime() - 1800000;
    const left = U.mins(opensAt - Date.now());
    return left <= 0 ? { open:true } : { open:false, why:'قبل', left };
  },

  chatBox(m, canWrite){
    const st = this.chatState(m);
    let body;
    if(st.open && !canWrite){
      body = `<div class="chat-log" id="chatlog"><div class="chat-shut">جارٍ التحميل…</div></div>
        <div class="chat-shut" style="border-top:1px solid var(--line);padding:11px">
          تطّلع كمشرف — لا يمكنك الكتابة في دردشة لست طرفاً فيها</div>`;
    } else if(st.open){
      body = `<div class="chat-log" id="chatlog"><div class="chat-shut">جارٍ التحميل…</div></div>
        <div class="chat-bar">
          <input id="chatin" placeholder="اكتب رسالة…" maxlength="500"
            onkeydown="if(event.key==='Enter')UI.sendChat('${m.id}')">
          <button class="chat-send" onclick="UI.sendChat('${m.id}')">↑</button>
        </div>`;
    } else if(st.why === 'قبل'){
      body = `<div class="chat-shut"><b>تُفتح قبل المباراة بنصف ساعة</b>
        بعد ${U.humanWait(st.left)} من الآن</div>`;
    } else if(st.why === 'انتهت'){
      body = `<div class="chat-shut"><b>أُغلقت الدردشة</b>
        تُمسح الرسائل بعد ساعتين من اعتماد النتيجة</div>`;
    } else {
      body = `<div class="chat-shut"><b>الدردشة مغلقة</b>${U.esc(st.why)}</div>`;
    }
    return `<div class="chat">
      <div class="chat-head">
        <b>دردشة المباراة</b>
        ${st.open ? `<span class="tag win"><i class="dot"></i>مفتوحة</span>` : ''}
        ${st.closing ? `<span class="tag">تُغلق بعد ${U.humanWait(st.closing)}</span>` : ''}
      </div>${body}</div>
      <div class="tiny dim center" style="margin-top:7px">
        خاصة بطرفَي المباراة والمشرف · تُمسح تلقائياً بعد انتهائها</div>`;
  },

  async loadChat(matchId, PM){
    const box = document.getElementById('chatlog');
    if(!box) return;
    const msgs = await Store.messages(matchId);
    box.innerHTML = msgs.length ? msgs.map(x=>{
      const mine = x.player_id === Store.me;
      return `<div class="msg ${mine?'mine':''}">
        ${mine ? '' : `<div class="who">${U.esc(PM[x.player_id]?.name || '—')}</div>`}
        ${U.esc(x.body)}
        <time>${U.fmtStamp(x.created_at).split('· ')[1] || ''}</time>
      </div>`;
    }).join('') : `<div class="chat-shut">لا رسائل بعد. ابدأ أنت.</div>`;
    box.scrollTop = box.scrollHeight;
  },

  async sendChat(matchId){
    const el = document.getElementById('chatin');
    const v = (el.value || '').trim();
    if(!v) return;
    el.value = '';
    try{
      await Store.sendMessage(matchId, v);
      const PM = await this.playersMap();
      await this.loadChat(matchId, PM);
    }catch(e){ el.value = v; this.toast(e.message,'err'); }
  },

  evidenceHtml(){
    if(!this._evd.length) return '';
    return `<div class="evd">${this._evd.map((e,i)=>
      `<img src="${e.image}" alt="إثبات ${i+1}" onclick="UI.zoom(${i})">`).join('')}</div>`;
  },
  zoom(i){
    this.sheet('إثبات النتيجة',
      `<img src="${this._evd[i].image}" style="width:100%;border-radius:12px" alt="إثبات">`);
  },

  /* ═══════════ الإدارة ═══════════ */
  async viewAdmin(){
    if(!Store.isAdmin){
      return `<div class="sec" style="margin-top:4px"><h2>الإدارة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="empty" style="padding:20px 6px">
          <h3>${Store.session ? 'حسابك ليس حساب إدارة' : 'سجّل دخولك أولاً'}</h3>
          <p>${Store.session
            ? 'اطلب من أحد المشرفين منحك الصلاحية.'
            : 'إدارة البطولات تتطلب حساباً بصلاحية إدارة.'}</p>
          ${Store.session ? '' : '<button class="btn solid" onclick="UI.identitySheet()">تسجيل الدخول</button>'}
        </div>
      </div>`;
    }
    const t = await Store.activeTournament();
    const list = await Store.tournaments();
    const players = await Store.players();
    let h = `<div class="sec" style="margin-top:4px"><h2>الإدارة</h2><div class="rule"></div>
      <span class="tag gold">${U.esc(Store.profile?.display_name||'')}</span></div>`;

    h += `<div class="card">
      <div class="row tight">
        <button class="btn sm solid" onclick="UI.tournamentForm()">بطولة جديدة</button>
        <button class="btn sm" onclick="UI.playersSheet()">اللاعبون (${players.length})</button>
        ${t?`<button class="btn sm" onclick="UI.entriesSheet()">مشاركو البطولة</button>`:''}
        <button class="btn sm" onclick="UI.adminsSheet()">المشرفون</button>
      </div>
    </div>`;

    if(t){
      const ms = await Store.matches(t.id);
      const ents = await Store.entries(t.id);
      const disputes = ms.filter(m=>m.status==='disputed');
      const pending = ms.filter(m=>m.status==='pending_confirmation');
      let total, rounds;
      if(t.kind === 'knockout'){
        let size = 1; while(size < ents.length) size *= 2;
        total = Math.max(0, ents.length - 1);
        rounds = ents.length > 1 ? Math.log2(size) : 0;
      } else {
        total = t.format==='double' ? ents.length*(ents.length-1) : ents.length*(ents.length-1)/2;
        rounds = ents.length ? (t.format==='double' ? (ents.length%2?ents.length:ents.length-1)*2 : (ents.length%2?ents.length:ents.length-1)) : 0;
      }

      h += `<div class="sec"><h2>${U.esc(t.name)}</h2><div class="rule"></div>
        <span class="tag ${t.status==='active'?'win':''}">${t.status==='active'?'جارية':'مسودة'}</span></div>
      <div class="card">
        <div class="kpis" style="margin-bottom:12px">
          <div class="kpi"><b class="num">${ents.length}</b><span>لاعب</span></div>

          <div class="kpi"><b class="num">${total}</b><span>مباراة</span></div>
          <div class="kpi"><b class="num">${ms.filter(m=>m.status==='completed').length}</b><span>مكتملة</span></div>
        </div>
        ${ents.length < 2 ? `<div class="note warn">أضف لاعبين للبطولة أولاً.</div>` :
          !ms.length ? `<button class="btn solid full" onclick="UI.generate()">${
            t.kind==='knockout' ? 'إجراء القرعة وتوليد الشجرة' : 'توليد جدول المباريات'}</button>` :
          `<div class="row tight">
            <button class="btn sm" onclick="UI.scheduleSheet()">مواعيد الجولات</button>
            <button class="btn sm danger" onclick="UI.regenerate()">إعادة توليد الجدول</button>
            <button class="btn sm" onclick="UI.tournamentForm('${t.id}')">تعديل البطولة</button>
            <button class="btn sm danger" onclick="UI.dropTournament('${t.id}')">حذف البطولة</button>
          </div>`}
      </div>`;

      const reqs = await Store.pendingRequests(t.id);
      if(reqs.length){
        h += `<div class="sec"><h2>طلبات انضمام</h2><div class="rule"></div>
          <span class="tag violet">${reqs.length}</span></div>
        <div class="card">${reqs.map(r=>`
          <div class="pick" style="cursor:default">
            ${this.av(r.player?.name)}
            <div style="flex:1;min-width:0">
              <div class="nm">${U.esc(r.player?.name||'—')}</div>
              <div class="tiny dim">${U.fmtStamp(r.created_at)}</div>
            </div>
            <button class="btn sm ok" onclick="UI.decide('${r.id}',true)">قبول</button>
            <button class="btn sm danger" onclick="UI.decide('${r.id}',false)">رفض</button>
          </div>`).join('')}</div>`;
      }

      if(disputes.length){
        const PM = await this.playersMap();
        h += `<div class="sec"><h2>نزاعات مفتوحة</h2><div class="rule"></div>
          <span class="tag" style="color:var(--lose)">${disputes.length}</span></div>
          ${disputes.map(m=>this.board(m,PM)).join('')}`;
      }
      if(pending.length){
        const PM = await this.playersMap();
        h += `<div class="sec"><h2>بانتظار التأكيد</h2><div class="rule"></div>
          <span class="tag violet">${pending.length}</span></div>
          ${pending.map(m=>this.board(m,PM)).join('')}`;
      }

      const logs = (await Store.auditLog(t.id)).slice(0,25);
      if(logs.length){
        h += `<div class="sec"><h2>سجل التدقيق</h2><div class="rule"></div></div>
        <div class="card">${logs.map(l=>`<div class="log">
          <time>${U.fmtStamp(l.created_at)}</time>
          <div><b>${U.esc(l.actor_name)}</b> — ${U.esc(l.action)}${l.detail?` <span class="dim">${U.esc(l.detail)}</span>`:''}</div>
        </div>`).join('')}</div>`;
      }
    }

    if(list.length > 1){
      h += `<div class="sec"><h2>كل البطولات</h2><div class="rule"></div></div><div class="card">
        ${list.map(x=>`<button class="pick ${x.id===t?.id?'on':''}" onclick="UI.pickTournament('${x.id}')">
          <div class="av">${x.format==='double'?'⇄':'→'}</div>
          <div class="nm">${U.esc(x.name)}<div class="tiny dim" style="font-weight:700">${U.fmtDate(x.start_date)}</div></div>
        </button>`).join('')}</div>`;
    }


    return h;
  },

  /* ═══════════ الإجراءات ═══════════ */
  step(id, d){
    const el = document.getElementById(id);
    el.value = Math.max(0, Math.min(99, (Number(el.value)||0) + d));
    this.penToggle();
  },
  penToggle(){
    const box = document.getElementById('pens');
    if(!box) return;
    const a = document.getElementById('sa'), b = document.getElementById('sb');
    if(!a || !b) return;
    box.style.display = (Number(a.value) === Number(b.value)) ? '' : 'none';
  },

  _evidence: [],
  async pickEvidence(ev){
    const f = ev.target.files[0]; if(!f) return;
    try{
      const src = await this.compress(f);
      this._evidence = [src];
      document.getElementById('evdprev').innerHTML = `<img src="${src}" alt="إثبات">`;
    }catch(e){ this.toast('تعذّر قراءة الصورة','err'); }
  },
  compress(file){
    return new Promise((res,rej)=>{
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 900, sc = Math.min(1, max/Math.max(img.width,img.height));
          const c = document.createElement('canvas');
          c.width = img.width*sc; c.height = img.height*sc;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg', .6));
        };
        img.onerror = rej; img.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  },

  async attend(id){
    const m = await Store.match(id);
    const key = Store.me === m.player_a ? 'attend_a' : 'attend_b';
    await Store.updateMatch(id, {[key]: true});
    await Store.log(m.tournament_id, id, 'تأكيد الحضور');
    this.render(); this.toast('تم تأكيد حضورك','ok');
  },

  async setStatus(id, status){
    const m = await Store.match(id);
    await Store.updateMatch(id, {status});
    await Store.log(m.tournament_id, id, 'تغيير الحالة', CFG.STATUS[status]?.ar || status);
    this.render(); this.toast('تم التحديث','ok');
  },

  async report(id){
    const sa = Number(document.getElementById('sa').value);
    const sb = Number(document.getElementById('sb').value);
    if(!Number.isInteger(sa) || !Number.isInteger(sb) || sa<0 || sb<0)
      return this.toast('أدخل نتيجة صحيحة','err');
    const m = await Store.match(id);
    const trn = await Store.tournament(m.tournament_id);

    let pen = { pen_a:null, pen_b:null };
    if(trn.kind === 'knockout' && sa === sb){
      const pa = Number(document.getElementById('pa')?.value);
      const pb = Number(document.getElementById('pb')?.value);
      if(!Number.isInteger(pa) || !Number.isInteger(pb) || pa === pb)
        return this.toast('أدخل ركلات الترجيح — لا تعادل في الكأس','err');
      pen = { pen_a:pa, pen_b:pb };
    }
    const by = Store.isAdmin && !(Store.me===m.player_a||Store.me===m.player_b) ? m.player_a : Store.me;
    if(!by) return this.toast('حدّد اسمك أولاً','err');
    await Store.updateMatch(id, {
      score_a: sa, score_b: sb, status: 'pending_confirmation',
      result_type: 'normal', ...pen,
      reported_by: by, reported_at: U.nowISO(), result_at: U.nowISO()
    });
    if(this._evidence.length){ await Store.addEvidence(id, this._evidence); }
    this._evidence = [];
    await Store.log(m.tournament_id, id, 'تسجيل النتيجة', `${sa} – ${sb}`);
    this.render(); this.toast('سُجّلت — بانتظار تأكيد الخصم','ok');
  },

  async confirm(id, byAdmin){
    const m = await Store.match(id);

      status:'completed', confirmed_by: Store.me, confirmed_by_admin: !!byAdmin,
      confirmed_at: U.nowISO(), result_at: m.result_at || U.nowISO()
    });
    await Store.log(m.tournament_id, id, byAdmin?'اعتماد إداري للنتيجة':'تأكيد النتيجة', `${m.score_a} – ${m.score_b}`);

  pickOne(el, scope){

      .forEach(b=>b.classList.remove('on'));

  async decideMatch(id){
    const side = document.querySelector('#wo_side .pick.on').dataset.v;
    const why  = document.getElementById('wo_why').value;
    const hi   = Math.max(0, Number(document.getElementById('wo_a').value) || 0);
    const lo   = Math.max(0, Number(document.getElementById('wo_b').value) || 0);
    if(hi <= lo) return this.toast('نتيجة الفائز يجب أن تكون أعلى','err');

    const m = await Store.match(id); const PM = await this.playersMap();
    const win = side === 'a' ? m.player_a : m.player_b;
    try{
      await Store.updateMatch(id, {
        score_a: side==='a' ? hi : lo,
        score_b: side==='b' ? hi : lo,
        pen_a: null, pen_b: null,
        status:'completed', result_type:'decision', decision_reason: why,
        confirmed_by: Store.me, confirmed_by_admin: true,
        confirmed_at: U.nowISO(), result_at: U.nowISO()
      });
      await Store.log(m.tournament_id, id, 'حسم إداري',
        `${why} — الفوز لـ${PM[win]?.name||''}`);
      this.closeSheet(); this.render(); this.toast('اعتُمد القرار','ok');
    }catch(e){ this.toast(e.message,'err'); }

      <div class="note">هذا سجل عام لكل البطولات — أضف اللاعب مرة واحدة واستخدمه في أي دوري لاحق.</div>
      <div class="row" style="margin-bottom:12px">
        <input class="input" id="pn" placeholder="اسم اللاعب" style="flex:1" onkeydown="if(event.key==='Enter')UI.addPlayer()">
        <button class="btn solid" onclick="UI.addPlayer()">إضافة</button>
      </div>
      <div id="plist">${ps.length ? ps.map(p=>`<button class="pick" onclick="UI.editPlayerSheet('${p.id}')">
        ${this.av(p.name)}
        <div style="flex:1;min-width:0">
          <div class="nm">${U.esc(p.name)}</div>
          ${this.gameLine(p)}
        </div>
        ${p.profile_id?'<span class="tag win">مرتبط</span>':''}
      </button>`).join('')
        : `<div class="empty"><p>لا يوجد لاعبون بعد.</p></div>`}</div>`);
  },
  async addPlayer(){
    const el = document.getElementById('pn');
    const p = await Store.createPlayer(el.value);
    if(!p) return this.toast('اكتب اسماً','err');
    el.value = ''; this.playersSheet(); this.toast('أُضيف اللاعب','ok');
  },

  async editPlayerSheet(id){
    const p = await Store.player(id);
    this.sheet('تعديل اللاعب', `
      <div class="field"><label>الاسم</label>
        <input class="input" id="ep_name" value="${U.esc(p.name)}"></div>
      <div class="field"><label>حساب اللعبة <span class="dim">(اختياري)</span></label>
        <input class="input" id="ep_gid" dir="ltr" style="text-align:left"
          placeholder="EA ID" value="${U.esc(p.game_id||'')}"></div>
      <div class="field"><label>المنصة <span class="dim">(اختياري)</span></label>
        <div class="seg" id="ep_plat">
          <button class="${!p.platform?'on':''}" data-v="" onclick="UI.seg(this)">—</button>
          ${this.PLATFORMS.map(x=>`<button class="${p.platform===x?'on':''}" data-v="${x}" onclick="UI.seg(this)">${x}</button>`).join('')}
        </div></div>
      ${p.profile_id ? '<div class="note">هذا اللاعب مرتبط بحساب، ويستطيع تعديل بياناته بنفسه.</div>' : ''}
      <button class="btn solid full" onclick="UI.savePlayer('${id}')">حفظ</button>`);
  },
  async savePlayer(id){
    try{
      await Store.updatePlayer(id, {
        name: document.getElementById('ep_name').value.trim(),
        game_id: document.getElementById('ep_gid').value.trim() || null,
        platform: document.querySelector('#ep_plat .on').dataset.v || null
      });
      this.closeSheet(); this.render(); this.toast('حُفظ اللاعب','ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  async adminsSheet(){
    const list = await Store.profiles();
    this.sheet('المشرفون', `
      <div class="note">المشرف يستطيع إنشاء البطولات وتوليد الجداول وحسم النزاعات.</div>
      ${list.map(pr=>`<div class="pick" style="cursor:default">
        ${this.av(pr.display_name)}
        <div style="flex:1;min-width:0">
          <div class="nm">${U.esc(pr.display_name)}</div>
          <div class="tiny dim">@${U.esc(pr.username)}</div>
        </div>
        <button class="btn sm ${pr.is_admin?'danger':'ok'}"
          onclick="UI.toggleAdmin('${pr.id}',${!pr.is_admin})">
          ${pr.is_admin ? 'إلغاء' : 'ترقية'}</button>
      </div>`).join('')}`);
  },
  async decide(reqId, ok){
    try{
      await Store.decideJoin(reqId, ok);
      this.render();
      this.toast(ok ? 'قُبل اللاعب' : 'رُفض الطلب', ok ? 'ok' : 'err');
    }catch(e){ this.toast(e.message,'err'); }
  },
  async toggleAdmin(id, on){
    if(!on && id === Store.session?.user?.id &&
       !window.confirm('ستفقد صلاحية الإدارة عن نفسك. متابعة؟')) return;
    try{
      await Store.setProfileAdmin(id, on);
      this.adminsSheet(); this.render();
      this.toast(on ? 'رُقّي إلى مشرف' : 'أُلغيت الصلاحية', on ? 'ok' : 'err');
    }catch(e){ this.toast(e.message,'err'); }
  },

  async scheduleSheet(){
    const t = await Store.activeTournament();
    const ms = await Store.matches(t.id);
    const rounds = [...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);
    const info = r => {
      const list = ms.filter(m=>m.round===r);
      const done = list.filter(m=>m.status==='completed').length;
      return { date:list[0]?.match_date, time:(list[0]?.match_time||'21:00').slice(0,5),
               n:list.length, done };
    };
    this.sheet('مواعيد الجولات', `
      <div class="note">التوزيع التلقائي يبدأ من تاريخ البطولة بفاصل ${t.gap_days} يوم.
        عدّل أي جولة يدوياً هنا — المباريات المكتملة لا تتأثر.</div>
      <div class="row" style="margin-bottom:12px">
        <input class="input" id="sc_start" type="date" value="${t.start_date}" style="flex:1">
        <input class="input num" id="sc_gap" type="number" min="1" max="30"
          value="${t.gap_days}" style="width:74px" title="أيام بين الجولات">
        <button class="btn" onclick="UI.redistribute()">توزيع</button>
      </div>
      <div style="max-height:44vh;overflow-y:auto">
      ${rounds.map(r=>{
        const i = info(r);
        return `<div style="background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
          padding:9px 11px;margin-bottom:7px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
            <b style="font-size:.72rem">الجولة ${r}</b>
            <span class="tiny dim">${i.done}/${i.n} مكتملة</span>
          </div>
          <div class="row tight">
            <input class="input" type="date" data-r="${r}" data-k="d" value="${i.date}" style="flex:1;padding:7px 9px">
            <input class="input" type="time" data-r="${r}" data-k="t" value="${i.time}" style="width:104px;padding:7px 9px">
          </div>
        </div>`;
      }).join('')}
      </div>
      <button class="btn solid full" style="margin-top:11px" onclick="UI.saveSchedule()">حفظ المواعيد</button>`);
  },
  async redistribute(){
    const t = await Store.activeTournament();
    const start = document.getElementById('sc_start').value;
    const gap = Math.max(1, Number(document.getElementById('sc_gap').value)||2);
    if(!start) return this.toast('اختر تاريخ البداية','err');
    document.querySelectorAll('[data-k="d"]').forEach(el=>{
      el.value = U.addDays(start, (Number(el.dataset.r)-1) * gap);
    });
    await Store.updateTournament(t.id, { start_date:start, gap_days:gap });
    this.toast('وُزّعت — اضغط حفظ المواعيد');
  },
  async saveSchedule(){
    const t = await Store.activeTournament();
    const ds = [...document.querySelectorAll('[data-k="d"]')];
    try{
      for(const el of ds){
        const r = Number(el.dataset.r);
        const tm = document.querySelector(`[data-r="${r}"][data-k="t"]`).value;
        await Store.setRoundSchedule(t.id, r, el.value, tm);
      }
      await Store.refreshTournament(t.id);
      await Store.log(t.id, null, 'تعديل مواعيد الجولات', `${ds.length} جولة`);
      this.closeSheet(); this.render(); this.toast('حُفظت المواعيد','ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  async entriesSheet(){
    const t = await Store.activeTournament();
    const all = await Store.players();
    const cur = (await Store.entries(t.id)).map(e=>e.player_id);
    const ms = await Store.matches(t.id);
    this.sheet('مشاركو ' + U.esc(t.name), `
      ${ms.length?`<div class="note warn">الجدول مُولَّد. تغيير المشاركين يتطلب إعادة توليد الجدول.</div>`:''}
      ${all.length ? all.map(p=>`<button class="pick ${cur.includes(p.id)?'on':''}" data-p="${p.id}" onclick="this.classList.toggle('on')">
        ${this.av(p.name)}<div class="nm">${U.esc(p.name)}</div>
      </button>`).join('') : `<div class="empty"><p>أضف لاعبين للسجل أولاً.</p></div>`}
      <button class="btn solid full" style="margin-top:10px" onclick="UI.saveEntries()">حفظ المشاركين</button>`);
  },
  async saveEntries(){
    const t = await Store.activeTournament();
    const ids = [...document.querySelectorAll('.pick.on[data-p]')].map(b=>b.dataset.p);
    if(ids.length < 2) return this.toast('اختر لاعبين اثنين على الأقل','err');
    await Store.setEntries(t.id, ids);
    await Store.log(t.id, null, 'تحديث المشاركين', `${ids.length} لاعب`);
    this.closeSheet(); this.render(); this.toast('حُفظ المشاركون','ok');
  },

  /* اختيار طريقة القرعة قبل توليد الشجرة */
  async seedSheet(){
    const t = await Store.activeTournament();
    const ents = await Store.entries(t.id);
    const others = (await Store.tournaments()).filter(x => x.id !== t.id && x.kind !== 'knockout');
    let size = 1; while(size < ents.length) size *= 2;
    this._seed = ents.map(e => e.player_id);

    this.sheet('قرعة الكأس', `
      <div class="note">${ents.length} لاعباً في شجرة من ${size} مقعداً —
        ${size - ents.length ? `${size - ents.length} يعبرون الدور الأول مباشرة` : 'بلا إعفاءات'}.</div>
      <div class="field"><label>طريقة القرعة</label>
        <div class="seg" id="sd">
          <button class="on" data-v="random" onclick="UI.seg(this);UI.seedMode()">عشوائية</button>
          <button data-v="prev" onclick="UI.seg(this);UI.seedMode()">ترتيب دوري</button>
          <button data-v="manual" onclick="UI.seg(this);UI.seedMode()">يدوية</button>
        </div></div>
      <div id="sdprev" style="display:none" class="field">
        <label>البطولة المرجعية</label>
        <select class="input" id="sdsrc">
          ${others.length ? others.map(x=>`<option value="${x.id}">${U.esc(x.name)}</option>`).join('')
            : '<option value="">لا توجد بطولات سابقة</option>'}
        </select>
      </div>
      <div id="sdlist" style="display:none">
        <label style="display:block;font-size:.65rem;font-weight:800;color:var(--ink-2);margin-bottom:6px">
          الترتيب — الأول يواجه الأخير</label>
        <div id="sdrows" style="max-height:40vh;overflow-y:auto"></div>
      </div>
      <button class="btn solid full" style="margin-top:11px" onclick="UI.buildBracket()">
        توليد الشجرة</button>`);
  },
  seedMode(){
    const v = document.querySelector('#sd .on').dataset.v;
    document.getElementById('sdprev').style.display = v === 'prev' ? '' : 'none';
    document.getElementById('sdlist').style.display = v === 'manual' ? '' : 'none';
    if(v === 'manual') this.seedRows();
  },
  async seedRows(){
    const PM = await this.playersMap();
    document.getElementById('sdrows').innerHTML = this._seed.map((id,i)=>`
      <div class="pick" style="cursor:default">
        <div class="rank num">${i+1}</div>
        <div class="nm">${U.esc(PM[id]?.name||'—')}</div>
        <button class="btn sm" onclick="UI.seedMove(${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="btn sm" onclick="UI.seedMove(${i},1)" ${i===this._seed.length-1?'disabled':''}>↓</button>
      </div>`).join('');
  },
  seedMove(i, d){
    const j = i + d;
    if(j < 0 || j >= this._seed.length) return;
    [this._seed[i], this._seed[j]] = [this._seed[j], this._seed[i]];
    this.seedRows();
  },

  async buildBracket(){
    const t = await Store.activeTournament();
    const mode = document.querySelector('#sd .on').dataset.v;
    let ids = this._seed.slice();

    if(mode === 'random'){
      for(let i = ids.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
    } else if(mode === 'prev'){
      const src = document.getElementById('sdsrc').value;
      if(!src) return this.toast('لا توجد بطولة مرجعية','err');
      await Store.refreshTournament(src);
      const rows = Engine.standings(await Store.matches(src), await Store.entries(src));
      const rank = {}; rows.forEach((r,i)=> rank[r.id] = i);
      ids.sort((a,b)=> (rank[a] ?? 999) - (rank[b] ?? 999));
    }

    const uid = () => (crypto.randomUUID ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));

    const br = Engine.bracket(ids, uid);
    const list = br.matches.map(m => ({
      id: m.id, tournament_id: t.id, round: m.round, slot: m.slot,
      player_a: m.player_a, player_b: m.player_b,
      next_match_id: m.next_match_id, next_slot: m.next_slot,
      match_date: U.addDays(t.start_date, (m.round - 1) * t.gap_days),
      match_time: t.match_time, status: 'scheduled'
    }));

    try{
      await Store.saveMatches(list);
      await Store.updateTournament(t.id, { status:'active' });
      await Store.log(t.id, null, 'توليد الشجرة',
        `${list.length} مباراة · ${br.rounds} أدوار · ${br.byes} إعفاء`);
      this.closeSheet(); this.render();
      this.toast(`تولّدت شجرة من ${br.size}`,'ok');
    }catch(e){ this.toast(e.message,'err'); }
  },

  async generate(){
    const t = await Store.activeTournament();
    if(t.kind === 'knockout') return this.seedSheet();
    const ents = await Store.entries(t.id);
    const ids = ents.map(e=>e.player_id);
    const legs = Engine.fixtures(ids, t.format === 'double');
    const list = [];
    legs.forEach((pairs, i) => {
      const date = U.addDays(t.start_date, i * t.gap_days);
      pairs.forEach(([a,b]) => list.push({
        tournament_id: t.id, round: i+1,
        player_a: a, player_b: b,
        match_date: date, match_time: t.match_time,
        status: 'scheduled'
      }));
    });
    await Store.saveMatches(list);
    await Store.updateTournament(t.id, { status:'active' });
    await Store.log(t.id, null, 'توليد الجدول', `${list.length} مباراة · ${legs.length} جولة`);
    this.render();
    this.toast(`تولّد ${list.length} مباراة في ${legs.length} جولة`,'ok');
  },
  async regenerate(){
    if(!window.confirm('إعادة التوليد تحذف كل المباريات ونتائجها. متابعة؟')) return;
    const t = await Store.activeTournament();
    await Store.clearMatches(t.id);
    await Store.log(t.id, null, 'حذف الجدول');
    await this.generate();
  },

  /* — حالات فارغة — */
  notConfigured(){
    document.getElementById('view').innerHTML = `
      <div class="empty" style="margin-top:60px">
        <h3>التطبيق غير جاهز بعد</h3>
        <p>لم تكتمل تهيئة الدوري. تواصل مع المشرف.</p>
      </div>`;
    return null;
  },
  /* حالة استعداد اللاعب — تُعرض لغير المشرفين بدل رسائل الإدارة */
  steps(stage){
    const st = [
      { b:'أنشئ حسابك', s:'اسم مستخدم وكلمة مرور', ok: !!Store.session },
      { b:'اربط اسمك', s:'لتظهر لك مبارياتك', ok: !!Store.myPlayer },
      { b: stage==='fixtures' ? 'انطلاق الجولة الأولى' : 'إعلان البطولة',
        s: stage==='fixtures' ? 'الجدول قيد الإعداد' : 'بانتظار المشرفين', ok:false }
    ];
    const first = st.findIndex(x=>!x.ok);
    return `<div class="steps">${st.map((x,i)=>{
      const cls = x.ok ? 'done' : (i===first ? 'now' : 'pending');
      return `<div class="step ${cls}">
        <i>${x.ok ? '✓' : i+1}</i>
        <div><b>${x.b}</b><small>${x.s}</small></div>
      </div>`;
    }).join('')}</div>`;
  },

  waiting(title, body, stage){
    return `<div class="wait">
      <div class="wait-mark"><span>FC 27</span></div>
      <h3>${title}</h3>
      <p>${body}</p>
      ${this.steps(stage)}
      ${!Store.session ? `<button class="btn solid" style="margin-top:24px"
          onclick="UI.identitySheet()">أنشئ حسابك الآن</button>` : ''}
      ${Store.session && !Store.myPlayer ? `<button class="btn solid" style="margin-top:24px"
          onclick="UI.linkSheet()">اربط اسمك</button>` : ''}
    </div>`;
  },

  noTournament(){
    if(Store.isAdmin)
      return `<div class="empty" style="margin-top:40px">
        <h3>لا توجد بطولة بعد</h3>
        <p>أنشئ أول بطولة، أضف اللاعبين، ثم ولّد الجدول.</p>
        <a class="btn solid" href="#/admin">ابدأ من الإدارة</a>
      </div>`;
    return this.waiting('لم ينطلق الدوري بعد',
      'ما إن يعلن المشرفون عن البطولة حتى يظهر جدولك ومبارياتك هنا.', 'tournament');
  },

  noFixtures(t){
    if(Store.isAdmin)
      return `<div class="empty" style="margin-top:40px">
        <h3>${U.esc(t.name)} — بلا جدول</h3>
        <p>حدّد المشاركين ثم ولّد جدول المباريات.</p>
        <a class="btn solid" href="#/admin">اذهب للإدارة</a>
      </div>`;
    return this.waiting(U.esc(t.name),
      'يجهّز المشرفون قائمة المشاركين وجدول المباريات. لن يطول الأمر.', 'fixtures');
  },

  /* — العرض — */
  async render(){
    const view = document.getElementById('view');
    const [, seg, param, sub] = location.hash.replace('#','').split('/');
    this.state.route = '/' + (seg || '');
    this.state.param = param || null;
    this.state.sub = sub || null;
    let html = '';
    if(!Store.configured) return this.notConfigured();
    try{
      await Store.syncActive();
      if(seg === 'matches')      html = await this.viewMatchCenter();
      else if(seg === 'stats')   html = await this.viewStats();
      else if(seg === 't')       html = await this.viewTournament(param);
      else if(seg === 'player')  html = await this.viewPlayer(param);
      else if(seg === 'admin')   html = await this.viewAdmin();
      else if(seg === 'match')   html = await this.viewMatch(param);
      else if(seg === 'account') html = await this.viewAccount();
      else if(seg === 'table'){
        const a = Store.db.meta.activeTournament;
        if(a){ location.hash = '#/t/' + a; return; }
        html = await this.viewTournaments();
      }
      else html = await this.viewTournaments();
    }catch(e){
      console.error(e);
      html = `<div class="empty"><h3>تعذّر تحميل البيانات</h3><p>${U.esc(e.message)}</p>
        <button class="btn" onclick="Store.reload().then(()=>UI.render())">إعادة المحاولة</button></div>`;
    }
    view.innerHTML = html + this.foot();
    await this.chrome();
    window.scrollTo({top:0});

    // الدردشة: تحميل الرسائل والاشتراك في التحديث اللحظي
    if(Store.configured) Store.unwatchChat();
    if(this._chatFor){
      const cid = this._chatFor;
      const PM = await this.playersMap();
      await this.loadChat(cid, PM);
      Store.watchChat(cid, () => this.loadChat(cid, PM));
    }
  }
};

/* ─────────── 6) الإقلاع ─────────── */
window.addEventListener('hashchange', ()=>{
  UI.state.roundView = null; UI.state.tab = null;
  UI.render();
});
(async function boot(){
  try{ await Store.init(); }
  catch(e){ console.error(e); }
  if(!location.hash) location.hash = '#/';
  await UI.render();
  if(Store.configured) Store.watch(Store.db.meta.activeTournament);
})();
</script>
