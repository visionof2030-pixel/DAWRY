<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>دوري FC 27 — منصة المباريات</title>
<meta name="description" content="منصة إدارة دوريات FC 27 بين اللاعبين: جدول المباريات، النتائج، الترتيب، والإحصائيات." />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="دوري FC 27" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   هوية «لوحة النتائج» — FC 27
   ليل الملعب · ذهب البطولة · بنفسجي التنبيه · أحمر البث المباشر
   ============================================================ */
:root{
  --bg:#0b0d12; --bg-2:#12151d;
  --surface:#171b25; --surface-2:#1e2430; --surface-3:#252c3a;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
  --ink:#eef1f6; --ink-2:#9aa4b6; --ink-3:#646e80;
  --gold:#f2b544; --gold-soft:rgba(242,181,68,.13); --gold-line:rgba(242,181,68,.32);
  --violet:#8b7bff; --violet-soft:rgba(139,123,255,.13);
  --live:#ff4d5e; --live-soft:rgba(255,77,94,.13);
  --win:#31c98a; --win-soft:rgba(49,201,138,.13);
  --draw:#f2b544;
  --lose:#ff5f6d; --lose-soft:rgba(255,95,109,.12);
  --gold-grad:linear-gradient(135deg,#f7c65c,#e09a24);
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.7;min-height:100vh;overflow-wrap:anywhere;
  background-image:radial-gradient(1100px 420px at 50% -220px,rgba(242,181,68,.08),transparent 70%);
  background-attachment:fixed;
}
.num{font-family:'Oxanium',monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== الهيكل ===== */
.app{max-width:760px;margin:0 auto;padding:0 13px calc(84px + env(safe-area-inset-bottom))}

/* ===== شريط علوي ===== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,13,18,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);margin:0 0 14px;padding:calc(8px + env(safe-area-inset-top)) 13px 8px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:9px}
.logo{display:flex;align-items:baseline;gap:6px;font-weight:900;font-size:.95rem;letter-spacing:-.2px;flex-shrink:0}
.logo b{font-family:'Oxanium';color:var(--gold);font-weight:800}
.spacer{flex:1}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:30px;
  padding:5px 12px;font-size:.66rem;font-weight:800;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;max-width:150px;min-width:0;flex-shrink:1}
.chip:hover{border-color:var(--gold-line);color:var(--gold)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.me{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}

/* ===== التنقل السفلي ===== */
.nav{position:fixed;bottom:0;right:0;left:0;z-index:50;
  background:rgba(14,17,23,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--ink-3);
  font-size:.6rem;font-weight:800;transition:.18s}
.nav a svg{width:20px;height:20px;stroke-width:1.9}
.nav a.on{color:var(--gold)}
.nav a.on svg{filter:drop-shadow(0 0 8px rgba(242,181,68,.45))}

/* ===== عناصر عامة ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:11px}
.sec{margin:20px 0 10px;display:flex;align-items:center;gap:9px}
.sec h2{font-size:.86rem;font-weight:900;letter-spacing:-.2px}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .more{font-size:.64rem;font-weight:800;color:var(--gold);text-decoration:none}
.eyebrow{font-size:.6rem;font-weight:800;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:.64rem}
.center{text-align:center}

.btn{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);
  padding:9px 16px;border-radius:30px;font-size:.72rem;font-weight:800;cursor:pointer;
  transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--gold-line);color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--gold-grad);color:#1a1206;border:none;font-weight:900}
.btn.solid:hover{color:#1a1206;box-shadow:0 8px 24px rgba(242,181,68,.28)}
.btn.danger{background:var(--lose-soft);border-color:rgba(255,95,109,.35);color:var(--lose)}
.btn.danger:hover{background:var(--lose);color:#fff;border-color:transparent}
.btn.ok{background:var(--win-soft);border-color:rgba(49,201,138,.35);color:var(--win)}
.btn.ok:hover{background:var(--win);color:#06231a;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.66rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn svg{width:14px;height:14px;flex-shrink:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.tight{gap:6px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:.6rem;font-weight:800;
  padding:3px 10px;border-radius:30px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.gold{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}
.tag.live{background:var(--live-soft);color:var(--live);border-color:rgba(255,77,94,.3)}
.tag.win{background:var(--win-soft);color:var(--win);border-color:rgba(49,201,138,.3)}
.tag.violet{background:var(--violet-soft);color:var(--violet);border-color:rgba(139,123,255,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.dot.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.5)}70%{box-shadow:0 0 0 7px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}

/* ===== العنصر المميز: لوحة النتيجة ===== */
.board{position:relative;display:block;width:100%;text-align:right;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px 12px 12px;cursor:pointer;transition:.2s;overflow:hidden}
.board:hover{border-color:var(--line-2);transform:translateY(-1px)}
.board::before{content:'';position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--ink-3)}
.board[data-s="live"]::before{background:var(--live)}
.board[data-s="pending_confirmation"]::before{background:var(--violet)}
.board[data-s="completed"]::before{background:var(--win)}
.board[data-s="disputed"]::before{background:var(--lose)}
.board[data-s="postponed"]::before,.board[data-s="cancelled"]::before{background:var(--ink-3)}
.board-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.board-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side.b{flex-direction:row-reverse;text-align:left}
.side .nm{font-size:.78rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side .nm.dimmed{color:var(--ink-3);font-weight:700}
.av{width:30px;height:30px;border-radius:9px;background:var(--surface-3);
  display:grid;place-items:center;font-size:.78rem;font-weight:900;flex-shrink:0;
  border:1px solid var(--line)}
.av.me{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.score{font-family:'Oxanium';font-variant-numeric:tabular-nums;font-weight:800;font-size:1.4rem;
  background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:2px 12px;
  min-width:74px;text-align:center;letter-spacing:.06em;flex-shrink:0}
.score.pending{font-size:.68rem;font-weight:800;font-family:'Cairo';color:var(--ink-3);padding:7px 10px;letter-spacing:0}

/* ===== الترتيب ===== */
.table{width:100%;border-collapse:collapse;font-size:.72rem}
.table th{font-size:.58rem;font-weight:800;color:var(--ink-3);padding:8px 4px;
  border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.table th:nth-child(2){text-align:right}
.table td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.table td:nth-child(2){text-align:right;width:99%}
.table tr:last-child td{border-bottom:none}
.table tr.me{background:var(--gold-soft)}
.rank{font-family:'Oxanium';font-weight:800;font-size:.78rem;width:26px}
.rank.top{color:var(--gold)}
.pl{display:flex;align-items:center;gap:7px;min-width:0}
.pl .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-family:'Oxanium';font-weight:800;font-size:.86rem;color:var(--gold)}
.sgn{direction:ltr;unicode-bidi:isolate;display:inline-block}
.form{display:inline-flex;gap:3px}
.fchip{width:15px;height:15px;border-radius:5px;font-size:.52rem;font-weight:900;
  display:grid;place-items:center;font-family:'Oxanium'}
.fchip.W{background:var(--win-soft);color:var(--win)}
.fchip.D{background:var(--gold-soft);color:var(--gold)}
.fchip.L{background:var(--lose-soft);color:var(--lose)}
.fchip.N{background:var(--surface-2);color:var(--ink-3)}

/* ===== نماذج ===== */
.field{margin-bottom:12px}
.field label{display:block;font-size:.65rem;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;
  padding:10px 12px;font-size:.76rem;font-weight:700;transition:.2s}
.input:focus{outline:none;border-color:var(--gold);background:var(--surface)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:left 14px top 18px,left 9px top 18px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;gap:5px;background:var(--bg-2);padding:4px;border-radius:30px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 6px;border:none;border-radius:30px;background:transparent;
  color:var(--ink-2);font-size:.68rem;font-weight:800;cursor:pointer;transition:.2s}
.seg button.on{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}

/* لوحة إدخال النتيجة */
.entry{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
.entry .who{text-align:center;font-size:.7rem;font-weight:800;margin-bottom:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:center;gap:7px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface-2);font-size:1rem;font-weight:800;cursor:pointer;line-height:1;
  display:grid;place-items:center;flex-shrink:0}
.stepper button:active{background:var(--gold-soft);color:var(--gold)}
.stepper input{width:46px;height:42px;text-align:center;font-family:'Oxanium';font-weight:800;
  font-size:1.25rem;background:var(--surface);border:1px solid var(--line-2);border-radius:10px}
.vs{font-family:'Oxanium';font-weight:800;color:var(--ink-3);font-size:.8rem;padding-top:22px}

/* ===== نافذة ===== */
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.62);
  backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line-2);border-radius:22px 22px 0 0;
  padding:16px 15px calc(20px + env(safe-area-inset-bottom));animation:rise .26s ease}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{font-size:.88rem;font-weight:900;flex:1}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);
  cursor:pointer;font-size:1rem;line-height:1;color:var(--ink-2);display:grid;place-items:center;flex-shrink:0}

/* ===== إشعار ===== */
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:50%;transform:translate(50%,20px);
  z-index:100;background:var(--surface-3);border:1px solid var(--line-2);border-radius:30px;
  padding:9px 18px;font-size:.7rem;font-weight:800;opacity:0;pointer-events:none;transition:.28s;
  max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(50%,0)}
.toast.ok{border-color:rgba(49,201,138,.4);color:var(--win)}
.toast.err{border-color:rgba(255,95,109,.4);color:var(--lose)}

/* ===== حالات فارغة ===== */
.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty h3{font-size:.82rem;font-weight:800;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:.68rem;margin-bottom:14px}

/* ===== شريط الجولات ===== */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;
  scrollbar-width:none}
.rounds::-webkit-scrollbar{display:none}
.rbtn{flex-shrink:0;padding:7px 13px;border-radius:30px;border:1px solid var(--line);
  background:var(--surface);font-size:.66rem;font-weight:800;color:var(--ink-2);cursor:pointer;transition:.2s}
.rbtn.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.rbtn.done{color:var(--ink-3)}

/* ===== قائمة اختيار ===== */
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;cursor:pointer;transition:.2s;margin-bottom:7px}
.pick:hover{border-color:var(--gold-line)}
.pick.on{background:var(--gold-soft);border-color:var(--gold-line)}
.pick .nm{font-size:.76rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== إحصاء سريع ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kpi{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center}
.kpi b{display:block;font-family:'Oxanium';font-size:1rem;font-weight:800}
.kpi span{font-size:.56rem;font-weight:800;color:var(--ink-3)}

.evd{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.evd img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line-2);cursor:pointer}
.note{background:var(--bg-2);border:1px solid var(--line);border-right:3px solid var(--gold);
  border-radius:10px;padding:9px 12px;font-size:.68rem;color:var(--ink-2);margin-bottom:11px}
.note.warn{border-right-color:var(--lose)}
.note.violet{border-right-color:var(--violet)}

.log{font-size:.64rem;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log:last-child{border:none}
.log time{color:var(--ink-3);font-family:'Oxanium';flex-shrink:0}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo">دوري <b>FC 27</b></div>
    <div class="spacer"></div>
    <button class="chip" id="tchip" onclick="UI.tournamentSheet()"><span>—</span></button>
    <button class="chip me" id="mechip" onclick="UI.identitySheet()"><span>—</span></button>
  </div>
</header>

<main class="app" id="view"></main>

<nav class="nav">
  <div class="nav-in">
    <a href="#/" data-r="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>الرئيسية</a>
    <a href="#/matches" data-r="/matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>المباريات</a>
    <a href="#/table" data-r="/table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>الترتيب</a>
    <a href="#/admin" data-r="/admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6.5v5c0 4.6 3.4 8.4 8 9.5 4.6-1.1 8-4.9 8-9.5v-5z"/><path d="m9 12 2 2 4-4"/></svg>الإدارة</a>
  </div>
</nav>

<div class="sheet-bg" id="sheetbg" onclick="if(event.target===this)UI.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   دوري FC 27 — المرحلة الأولى
   البنية: CFG · Utils · Store · Engine · UI · Router
   قاعدة المشروع: المباراة هي مصدر الحقيقة الوحيد،
   والترتيب والإحصائيات تُحسب منها لحظياً ولا تُخزَّن.
   ============================================================ */
'use strict';

/* ─────────── 1) الإعدادات ─────────── */
const CFG = {
  KEY: 'fc27_v1',

  /* ═══ ضع بيانات مشروع Supabase هنا ═══
     Settings → API Keys → انسخ Publishable key (يبدأ بـ sb_publishable_)
     ومن Settings → Data API انسخ Project URL */
  SB: {
    URL: 'ضع-رابط-المشروع-هنا',
    KEY: 'ضع-المفتاح-العام-هنا'
  },
  MAIL_DOMAIN: 'fc27.app',
  TZ: 'Asia/Riyadh',
  DEFAULT_TIME: '21:00',
  POINTS: { win:3, draw:1, loss:0 },
  TIEBREAK: ['pts','gd','gf','h2h','won'],
  STATUS: {
    scheduled:{ ar:'مجدولة', cls:'' },
    live:{ ar:'تُلعب الآن', cls:'live' },
    pending_confirmation:{ ar:'بانتظار تأكيد الخصم', cls:'violet' },
    completed:{ ar:'مكتملة', cls:'win' },
    disputed:{ ar:'عليها نزاع', cls:'' },
    postponed:{ ar:'مؤجلة', cls:'' },
    cancelled:{ ar:'ملغاة', cls:'' }
  }
};

/* ─────────── 2) أدوات ─────────── */
const U = {
  uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); },
  // التاريخ مثبّت على توقيت الرياض في كل النظام
  today(){ return new Intl.DateTimeFormat('en-CA',{timeZone:CFG.TZ}).format(new Date()); },
  nowISO(){ return new Date().toISOString(); },
  // حساب التواريخ على أجزاء النص مباشرة — تجنّباً لانزياح UTC
  addDays(iso, n){
    const [y,m,d] = iso.split('-').map(Number);
    const t = new Date(Date.UTC(y, m-1, d));
    t.setUTCDate(t.getUTCDate() + n);
    return t.toISOString().slice(0,10);
  },
  diffDays(a,b){
    const p = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); };
    return Math.round((p(b)-p(a))/86400000);
  },
  dayName(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  },
  fmtDate(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-').map(Number);
    const mo = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][m-1];
    const t = U.today();
    if(iso === t) return 'اليوم';
    if(iso === U.addDays(t,1)) return 'غداً';
    if(iso === U.addDays(t,-1)) return 'أمس';
    return `${U.dayName(iso)} ${d} ${mo}`;
  },
  fmtTime(hm){
    if(!hm) return '';
    let [h,m] = hm.split(':').map(Number);
    const ap = h >= 12 ? 'م' : 'ص';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,'0')} ${ap}`;
  },
  fmtStamp(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const day = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.TZ}).format(d);
    const tm = new Intl.DateTimeFormat('en-GB',{timeZone:CFG.TZ,hour:'2-digit',minute:'2-digit'}).format(d);
    return `${U.fmtDate(day)} · ${U.fmtTime(tm)}`;
  },
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  initials(name){ return String(name||'؟').trim().charAt(0); }
};

/* ─────────── 3) طبقة البيانات — Supabase ───────────
   نفس تواقيع المرحلة الأولى بالضبط، والواجهة لم تتغير.
   ما تغيّر هو جسم الدوال فقط: localStorage ← Supabase. */
const Store = {
  sb: null, configured: false,
  session: null, profile: null, myPlayer: null,
  cache: { tournaments: [], players: [], entries: {}, matches: {}, audit: {} },
  db: { meta: { activeTournament: null } },

  /* — الإقلاع — */
  async init(){
    if(!CFG.SB.URL || CFG.SB.URL.indexOf('ضع-') === 0 || !CFG.SB.KEY){
      this.configured = false; return;
    }
    this.sb = supabase.createClient(CFG.SB.URL, CFG.SB.KEY);
    this.configured = true;
    const { data } = await this.sb.auth.getSession();
    this.session = data.session || null;
    this.sb.auth.onAuthStateChange(async (_e, s) => {
      this.session = s || null;
      await this.loadIdentity();
      await this.refreshBase();
      UI.render();
    });
    await this.loadIdentity();
    await this.refreshBase();
    const saved = localStorage.getItem(CFG.KEY + '_active');
    this.db.meta.activeTournament =
      (saved && this.cache.tournaments.some(t => t.id === saved))
        ? saved : (this.cache.tournaments[0]?.id || null);
  },

  _err(e){
    const raw = e?.message || String(e);
    const map = {
      'Invalid login credentials': 'اسم المستخدم أو كلمة المرور غير صحيحة',
      'User already registered': 'اسم المستخدم مستخدم من قبل',
      'Password should be at least 6 characters': 'كلمة المرور يجب ألا تقل عن 6 أحرف',
      'Email not confirmed': 'تأكيد البريد مفعّل في Supabase — عطّله من إعدادات المصادقة'
    };
    for(const k in map) if(raw.includes(k)) return map[k];
    if(raw.includes('row-level security')) return 'ليست لديك صلاحية لهذا الإجراء';
    if(raw.includes('Failed to fetch')) return 'تعذّر الاتصال بالخادم';
    return raw;
  },

  /* — الهوية — */
  async loadIdentity(){
    this.profile = null; this.myPlayer = null;
    if(!this.session) return;
    const { data: pr } = await this.sb.from('profiles')
      .select('*').eq('id', this.session.user.id).maybeSingle();
    this.profile = pr || null;
    const { data: pl } = await this.sb.from('players')
      .select('*').eq('profile_id', this.session.user.id).maybeSingle();
    this.myPlayer = pl || null;
  },

  get me(){ return this.myPlayer?.id || null; },
  get isAdmin(){ return !!this.profile?.is_admin; },
  get isGuest(){ return !this.session; },

  /* اسم المستخدم يُحوَّل لبريد داخلي — اللاعب لا يرى هذا إطلاقاً */
  _email(username){ return String(username).trim().toLowerCase() + '@' + CFG.MAIL_DOMAIN; },

  async signUp(username, password, displayName){
    const u = String(username||'').trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(u))
      throw new Error('اسم المستخدم: 3–20 حرفاً إنجليزياً أو رقماً أو شرطة سفلية');
    if(String(password||'').length < 6) throw new Error('كلمة المرور يجب ألا تقل عن 6 أحرف');
    const { error } = await this.sb.auth.signUp({
      email: this._email(u), password,
      options: { data: { username: u, display_name: String(displayName||'').trim() || u } }
    });
    if(error) throw new Error(this._err(error));
    // بعض الإعدادات لا تُنشئ جلسة تلقائياً — نسجّل الدخول صراحةً
    if(!(await this.sb.auth.getSession()).data.session) await this.signIn(u, password);
  },

  async signIn(username, password){
    const { error } = await this.sb.auth.signInWithPassword({
      email: this._email(username), password
    });
    if(error) throw new Error(this._err(error));
  },

  async signOut(){ await this.sb.auth.signOut(); },

  async claimPlayer(playerId){
    const { error } = await this.sb.rpc('claim_player', { p_player: playerId });
    if(error) throw new Error(this._err(error));
    await this.loadIdentity(); await this.refreshBase();
  },
  async createMyPlayer(name){
    const { error } = await this.sb.rpc('create_my_player', { p_name: name });
    if(error) throw new Error(this._err(error));
    await this.loadIdentity(); await this.refreshBase();
  },

  /* — التحميل — */
  async refreshBase(){
    const [t, p] = await Promise.all([
      this.sb.from('tournaments').select('*').order('created_at', { ascending:false }),
      this.sb.from('players').select('*').order('name')
    ]);
    if(!t.error) this.cache.tournaments = t.data || [];
    if(!p.error) this.cache.players = p.data || [];
  },

  async refreshTournament(tid){
    if(!tid) return;
    const [e, m, a] = await Promise.all([
      this.sb.from('entries').select('*').eq('tournament_id', tid),
      this.sb.from('matches').select('*').eq('tournament_id', tid)
             .order('round').order('match_date'),
      this.sb.from('audit_log').select('*').eq('tournament_id', tid)
             .order('created_at', { ascending:false }).limit(120)
    ]);
    if(!e.error) this.cache.entries[tid] = e.data || [];
    if(!m.error) this.cache.matches[tid] = m.data || [];
    if(!a.error) this.cache.audit[tid]  = a.data || [];
  },

  async syncActive(){
    const tid = this.db.meta.activeTournament;
    if(tid && !this.cache.matches[tid]) await this.refreshTournament(tid);
  },
  async reload(){
    await this.refreshBase();
    await this.refreshTournament(this.db.meta.activeTournament);
  },

  /* — البطولات — */
  async tournaments(){ return this.cache.tournaments; },
  async tournament(id){ return this.cache.tournaments.find(t=>t.id===id) || null; },
  async activeTournament(){ return this.tournament(this.db.meta.activeTournament); },
  async setActiveTournament(id){
    this.db.meta.activeTournament = id;
    localStorage.setItem(CFG.KEY + '_active', id || '');
    await this.refreshTournament(id);
    this.watch(id);
  },
  async createTournament(data){
    const { data: row, error } = await this.sb.from('tournaments').insert({
      name: data.name, format: data.format || 'double',
      start_date: data.start_date, gap_days: Number(data.gap_days) || 2,
      match_time: data.match_time || CFG.DEFAULT_TIME
    }).select().single();
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
    await this.log(row.id, null, 'إنشاء بطولة', row.name);
    return row;
  },
  async updateTournament(id, patch){
    const { error } = await this.sb.from('tournaments').update(patch).eq('id', id);
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
  },
  async deleteTournament(id){
    const { error } = await this.sb.from('tournaments').delete().eq('id', id);
    if(error) throw new Error(this._err(error));
    delete this.cache.entries[id]; delete this.cache.matches[id]; delete this.cache.audit[id];
    await this.refreshBase();
    if(this.db.meta.activeTournament === id)
      await this.setActiveTournament(this.cache.tournaments[0]?.id || null);
  },

  /* — اللاعبون — */
  async players(){ return this.cache.players; },
  async player(id){ return this.cache.players.find(p=>p.id===id) || null; },
  async createPlayer(name){
    const nm = String(name||'').trim();
    if(!nm) return null;
    const dup = this.cache.players.find(p=>p.name === nm);
    if(dup) return dup;
    const { data, error } = await this.sb.from('players').insert({ name:nm }).select().single();
    if(error) throw new Error(this._err(error));
    await this.refreshBase();
    return data;
  },

  /* — المشاركون — */
  async entries(tid){
    return (this.cache.entries[tid] || [])
      .map(e => ({ ...e, player: this.cache.players.find(p=>p.id===e.player_id) }))
      .filter(e => e.player);
  },
  async setEntries(tid, playerIds){
    const cur = (this.cache.entries[tid] || []).map(e=>e.player_id);
    const add = playerIds.filter(id => !cur.includes(id));
    const del = cur.filter(id => !playerIds.includes(id));
    if(del.length){
      const { error } = await this.sb.from('entries').delete()
        .eq('tournament_id', tid).in('player_id', del);
      if(error) throw new Error(this._err(error));
    }
    if(add.length){
      const { error } = await this.sb.from('entries')
        .insert(add.map(pid => ({ tournament_id: tid, player_id: pid })));
      if(error) throw new Error(this._err(error));
    }
    await this.refreshTournament(tid);
  },

  /* — المباريات — */
  async matches(tid){ return this.cache.matches[tid] || []; },
  async match(id){
    for(const tid in this.cache.matches){
      const m = this.cache.matches[tid].find(x=>x.id===id);
      if(m) return m;
    }
    const { data } = await this.sb.from('matches').select('*').eq('id', id).maybeSingle();
    return data || null;
  },
  async saveMatches(list){
    // إدخال على دفعات — 200 مباراة في طلب واحد قد تتجاوز حد الحجم
    for(let i=0; i<list.length; i+=100){
      const { error } = await this.sb.from('matches').insert(list.slice(i, i+100));
      if(error) throw new Error(this._err(error));
    }
    await this.refreshTournament(list[0]?.tournament_id);
  },
  async clearMatches(tid){
    const { error } = await this.sb.from('matches').delete().eq('tournament_id', tid);
    if(error) throw new Error(this._err(error));
    await this.refreshTournament(tid);
  },
  async updateMatch(id, patch){
    const { data, error } = await this.sb.from('matches').update(patch).eq('id', id).select().single();
    if(error) throw new Error(this._err(error));
    const arr = this.cache.matches[data.tournament_id];
    if(arr){ const i = arr.findIndex(m=>m.id===id); if(i>-1) arr[i] = data; }
    return data;
  },

  /* — صور الإثبات — جدول منفصل، تُحمَّل عند فتح المباراة فقط — */
  async evidence(matchId){
    const { data } = await this.sb.from('match_evidence')
      .select('id,image').eq('match_id', matchId).order('created_at');
    return data || [];
  },
  async addEvidence(matchId, images){
    if(!images.length) return;
    const { error } = await this.sb.from('match_evidence')
      .insert(images.map(img => ({ match_id: matchId, image: img, uploaded_by: this.me })));
    if(error) throw new Error(this._err(error));
  },

  /* — سجل التدقيق — */
  async log(tid, mid, action, detail){
    if(!this.session) return;
    const actor = this.isAdmin ? 'الإدارة'
      : (this.myPlayer?.name || this.profile?.display_name || 'لاعب');
    await this.sb.from('audit_log').insert({
      tournament_id: tid, match_id: mid, actor_name: actor,
      action, detail: detail || null
    });
    if(tid){
      const { data } = await this.sb.from('audit_log').select('*')
        .eq('tournament_id', tid).order('created_at',{ascending:false}).limit(120);
      this.cache.audit[tid] = data || [];
    }
  },
  async auditLog(tid, mid){
    const all = this.cache.audit[tid] || [];
    return mid ? all.filter(a => a.match_id === mid) : all;
  },

  /* — التحديث اللحظي — */
  _chan: null,
  watch(tid){
    if(this._chan){ this.sb.removeChannel(this._chan); this._chan = null; }
    if(!tid) return;
    this._chan = this.sb.channel('m_' + tid)
      .on('postgres_changes',
          { event:'*', schema:'public', table:'matches', filter:'tournament_id=eq.'+tid },
          () => {
            clearTimeout(this._deb);
            this._deb = setTimeout(async () => {
              await this.refreshTournament(tid);
              UI.render();
            }, 400);
          })
      .subscribe();
  }
};

/* ─────────── 4) المحرّك — دوال نقية ───────────
   لا تلمس DOM ولا التخزين. مدخلاتها مباريات ولاعبون فقط. */
const Engine = {

  /* توليد الجدول بطريقة الدائرة (Berger) */
  fixtures(ids, double){
    const p = ids.slice();
    if(p.length % 2) p.push(null);          // لاعب وهمي عند العدد الفردي
    const n = p.length, legs = [];
    for(let r=0; r<n-1; r++){
      const pairs = [];
      for(let i=0; i<n/2; i++){
        const a = p[i], b = p[n-1-i];
        if(a && b) pairs.push(r % 2 ? [b,a] : [a,b]);
      }
      legs.push(pairs);
      p.splice(1, 0, p.pop());              // تدوير مع تثبيت الأول
    }
    if(double) legs.push(...legs.map(rd => rd.map(([a,b]) => [b,a])));
    return legs;
  },

  /* المباريات المحسوبة في الترتيب فقط */
  isCounted(m){ return m.status === 'completed'; },

  standings(matches, entries, pts){
    const P = pts || CFG.POINTS;
    const rows = {};
    entries.forEach(e => {
      rows[e.player_id] = { id:e.player_id, name:e.player.name,
        pld:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0, wo:0 };
    });
    matches.filter(Engine.isCounted).forEach(m => {
      const A = rows[m.player_a], B = rows[m.player_b];
      if(!A || !B) return;
      const sa = Number(m.score_a), sb = Number(m.score_b);
      A.pld++; B.pld++;
      A.gf += sa; A.ga += sb; B.gf += sb; B.ga += sa;
      if(m.result_type === 'walkover'){ A.wo++; B.wo++; }
      if(sa > sb){ A.w++; B.l++; A.pts += P.win; B.pts += P.loss; }
      else if(sa < sb){ B.w++; A.l++; B.pts += P.win; A.pts += P.loss; }
      else { A.d++; B.d++; A.pts += P.draw; B.pts += P.draw; }
    });
    const list = Object.values(rows);
    list.forEach(r => r.gd = r.gf - r.ga);

    // ترتيب أولي: النقاط ← فارق الأهداف ← الأهداف
    list.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || a.name.localeCompare(b.name,'ar'));

    // كسر التعادل بالمواجهة المباشرة داخل المجموعات المتساوية
    const out = [];
    let i = 0;
    while(i < list.length){
      let j = i;
      while(j+1 < list.length && list[j+1].pts===list[i].pts
            && list[j+1].gd===list[i].gd && list[j+1].gf===list[i].gf) j++;
      const grp = list.slice(i, j+1);
      if(grp.length > 1) Engine._h2hSort(grp, matches, P);
      out.push(...grp);
      i = j + 1;
    }
    out.forEach((r,idx)=> r.rank = idx + 1);
    return out;
  },

  _h2hSort(group, matches, P){
    const ids = group.map(r=>r.id);
    const mini = {};
    ids.forEach(id => mini[id] = { pts:0, gd:0, gf:0 });
    matches.filter(Engine.isCounted)
      .filter(m => ids.includes(m.player_a) && ids.includes(m.player_b))
      .forEach(m => {
        const sa = Number(m.score_a), sb = Number(m.score_b);
        mini[m.player_a].gf += sa; mini[m.player_a].gd += sa - sb;
        mini[m.player_b].gf += sb; mini[m.player_b].gd += sb - sa;
        if(sa > sb) mini[m.player_a].pts += P.win;
        else if(sb > sa) mini[m.player_b].pts += P.win;
        else { mini[m.player_a].pts += P.draw; mini[m.player_b].pts += P.draw; }
      });
    group.sort((a,b)=> mini[b.id].pts - mini[a.id].pts
      || mini[b.id].gd - mini[a.id].gd || mini[b.id].gf - mini[a.id].gf
      || b.w - a.w || a.name.localeCompare(b.name,'ar'));
  },

  /* آخر 5 نتائج للاعب — من الأحدث إلى الأقدم */
  form(matches, pid, n){
    return matches.filter(Engine.isCounted)
      .filter(m => m.player_a===pid || m.player_b===pid)
      .sort((a,b)=> (b.result_at||'').localeCompare(a.result_at||'') || b.round - a.round)
      .slice(0, n || 5)
      .map(m => {
        const mine = m.player_a===pid ? Number(m.score_a) : Number(m.score_b);
        const his  = m.player_a===pid ? Number(m.score_b) : Number(m.score_a);
        return mine > his ? 'W' : mine < his ? 'L' : 'D';
      });
  },

  currentRound(matches){
    const un = matches.filter(m => !['completed','cancelled'].includes(m.status));
    if(!un.length) return matches.reduce((x,m)=> Math.max(x,m.round), 1);
    return un.reduce((x,m)=> Math.min(x,m.round), 999);
  },

  leader(standings){ return standings[0] || null; }
};

/* ─────────── 5) الواجهة ─────────── */
const UI = {
  state: { route:'/', param:null, roundView:null },

  /* — أدوات عرض — */
  toast(msg, kind){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast on ' + (kind || '');
    clearTimeout(this._tt);
    this._tt = setTimeout(()=> t.className = 'toast', 2600);
  },
  sheet(title, html){
    document.getElementById('sheet').innerHTML =
      `<div class="sheet-head"><h3>${title}</h3><button class="x" onclick="UI.closeSheet()">✕</button></div>${html}`;
    document.getElementById('sheetbg').classList.add('on');
  },
  closeSheet(){ document.getElementById('sheetbg').classList.remove('on'); },

  av(name, isMe){
    return `<div class="av ${isMe?'me':''}">${U.esc(U.initials(name))}</div>`;
  },

  /* — لوحة النتيجة: العنصر المتكرّر في كل التطبيق — */
  board(m, players){
    const A = players[m.player_a], B = players[m.player_b];
    const me = Store.me;
    const st = CFG.STATUS[m.status] || CFG.STATUS.scheduled;
    const done = m.status === 'completed';
    const sa = Number(m.score_a), sb = Number(m.score_b);
    const nmA = `<div class="nm ${done && sa<sb ? 'dimmed':''}">${U.esc(A?.name||'—')}</div>`;
    const nmB = `<div class="nm ${done && sb<sa ? 'dimmed':''}">${U.esc(B?.name||'—')}</div>`;
    const scoreBox = (m.score_a==null)
      ? `<div class="score pending">${m.status==='postponed' ? 'مؤجلة' : m.status==='cancelled' ? 'ملغاة' : U.fmtTime(m.match_time)}</div>`
      : `<div class="score">${sa} <span class="dim">–</span> ${sb}</div>`;

    let badge = `<span class="tag ${st.cls}">${m.status==='live'?'<i class="dot pulse"></i>':''}${st.ar}</span>`;
    if(done && m.result_type==='walkover') badge = `<span class="tag">فوز بالانسحاب</span>`;

    return `<button class="board" data-s="${m.status}" onclick="location.hash='#/match/${m.id}'">
      <div class="board-top">
        <span class="eyebrow">الجولة ${m.round}</span>
        <span class="dim tiny">·</span>
        <span class="tiny dim">${U.fmtDate(m.match_date)}</span>
        <div class="spacer"></div>
        ${badge}
      </div>
      <div class="board-grid">
        <div class="side">${this.av(A?.name, A?.id===me)}${nmA}</div>
        ${scoreBox}
        <div class="side b">${this.av(B?.name, B?.id===me)}${nmB}</div>
      </div>
    </button>`;
  },

  async playersMap(){
    const all = await Store.players();
    const map = {}; all.forEach(p => map[p.id] = p); return map;
  },

  /* — الشريط العلوي — */
  async chrome(){
    const t = await Store.activeTournament();
    document.querySelector('#tchip span').textContent = t ? t.name : 'لا توجد بطولة';
    document.querySelector('#mechip span').textContent =
      Store.myPlayer ? Store.myPlayer.name : (Store.session ? 'اربط حسابك' : 'دخول');
    document.querySelectorAll('.nav a').forEach(a =>
      a.classList.toggle('on', a.dataset.r === '/' + (this.state.route.split('/')[1] || '')));
  },

  /* — نافذة اختيار البطولة — */
  async tournamentSheet(){
    const list = await Store.tournaments();
    const act = Store.db.meta.activeTournament;
    const rows = list.length ? list.map(t => `
      <button class="pick ${t.id===act?'on':''}" onclick="UI.pickTournament('${t.id}')">
        <div class="av">${t.format==='double'?'⇄':'→'}</div>
        <div class="nm">${U.esc(t.name)}<div class="tiny dim" style="font-weight:700">${t.format==='double'?'ذهاب وإياب':'ذهاب فقط'} · ${t.status==='active'?'جارية':'مسودة'}</div></div>
      </button>`).join('')
      : `<div class="empty"><h3>لا توجد بطولات</h3><p>أنشئ أول بطولة من صفحة الإدارة.</p></div>`;
    this.sheet('البطولات', rows +
      `<button class="btn solid full" style="margin-top:10px" onclick="UI.closeSheet();location.hash='#/admin'">إدارة البطولات</button>`);
  },
  async pickTournament(id){
    await Store.setActiveTournament(id);
    this.closeSheet(); this.render(); this.toast('تم التبديل','ok');
  },

  /* — الحساب: تسجيل دخول وإنشاء حساب وربط اللاعب — */
  async identitySheet(){
    if(!Store.configured) return this.sheet('غير مربوط',
      `<div class="note warn">لم تُضبط بيانات Supabase بعد. افتح الملف وعبّئ <b>CFG.SB</b> في أعلى الكود.</div>`);

    if(!Store.session) return this.authSheet('login');

    const pr = Store.profile;
    if(!Store.myPlayer) return this.linkSheet();

    this.sheet('حسابي', `
      <div class="card" style="display:flex;align-items:center;gap:11px;margin-bottom:12px">
        ${this.av(Store.myPlayer.name, true)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:.84rem">${U.esc(Store.myPlayer.name)}</div>
          <div class="tiny dim">@${U.esc(pr?.username||'')}${Store.isAdmin?' · إدارة':''}</div>
        </div>
      </div>
      <button class="btn full" onclick="UI.signOut()">تسجيل الخروج</button>`);
  },

  authSheet(mode){
    const isLogin = mode === 'login';
    this.sheet(isLogin ? 'تسجيل الدخول' : 'حساب جديد', `
      <div class="seg" style="margin-bottom:14px">
        <button class="${isLogin?'on':''}" onclick="UI.authSheet('login')">دخول</button>
        <button class="${!isLogin?'on':''}" onclick="UI.authSheet('signup')">حساب جديد</button>
      </div>
      ${!isLogin ? `<div class="field"><label>اسمك كما يظهر للجميع</label>
        <input class="input" id="au_name" placeholder="فهد" autocomplete="name"></div>` : ''}
      <div class="field"><label>اسم المستخدم</label>
        <input class="input" id="au_user" dir="ltr" style="text-align:left"
          placeholder="fahad" autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label>
        <input class="input" id="au_pass" type="password" dir="ltr" style="text-align:left"
          placeholder="••••••" autocomplete="${isLogin?'current-password':'new-password'}"
          onkeydown="if(event.key==='Enter')UI.doAuth('${mode}')"></div>
      <button class="btn solid full" id="au_btn" onclick="UI.doAuth('${mode}')">
        ${isLogin ? 'دخول' : 'إنشاء الحساب'}</button>
      <div class="tiny dim center" style="margin-top:9px">
        ${isLogin ? 'ليس لديك حساب؟ اختر «حساب جديد» بالأعلى.'
                  : 'حروف إنجليزية وأرقام فقط في اسم المستخدم.'}</div>`);
  },

  async doAuth(mode){
    const btn = document.getElementById('au_btn');
    const u = document.getElementById('au_user').value;
    const p = document.getElementById('au_pass').value;
    const n = document.getElementById('au_name')?.value;
    btn.disabled = true; btn.textContent = 'جارٍ…';
    try{
      if(mode === 'login') await Store.signIn(u, p);
      else await Store.signUp(u, p, n);
      this.closeSheet();
      this.toast('أهلاً بك','ok');
      await this.render();
      if(!Store.myPlayer) setTimeout(()=>this.linkSheet(), 400);
    }catch(e){
      this.toast(e.message,'err');
      btn.disabled = false; btn.textContent = mode==='login' ? 'دخول' : 'إنشاء الحساب';
    }
  },

  async linkSheet(){
    const free = (await Store.players()).filter(p => !p.profile_id);
    this.sheet('اربط حسابك بلاعب', `
      <div class="note">اختر اسمك من اللاعبين الذين أضافتهم الإدارة، أو أنشئ لاعباً جديداً باسمك.</div>
      ${free.length ? free.map(p=>`<button class="pick" onclick="UI.claim('${p.id}')">
        ${this.av(p.name)}<div class="nm">${U.esc(p.name)}</div></button>`).join('')
        : '<div class="tiny dim center" style="margin:12px 0">لا يوجد لاعبون متاحون للربط.</div>'}
      <div class="sec"><h2>أو أنشئ لاعباً جديداً</h2><div class="rule"></div></div>
      <div class="row">
        <input class="input" id="np_name" placeholder="اسمك" style="flex:1"
          value="${U.esc(Store.profile?.display_name||'')}">

    catch(e){ this.toast(e.message,'err'); }

  async createMine(){
    const n = document.getElementById('np_name').value.trim();
    if(!n) return this.toast('اكتب اسمك','err');
    try{ await Store.createMyPlayer(n); this.closeSheet(); this.render(); this.toast('تم إنشاء اللاعب','ok'); }
    catch(e){ this.toast(e.message,'err'); }
  },
  async signOut(){
    await Store.signOut(); this.closeSheet(); this.render(); this.toast('خرجت من حسابك');
  },

  /* ═══════════ الصفحات ═══════════ */

  async viewHome(){
    const t = await Store.activeTournament();
    if(!t) return this.noTournament();
    const [ms, ents, PM] = [await Store.matches(t.id), await Store.entries(t.id), await this.playersMap()];
    if(!ms.length) return this.noFixtures(t);

    const table = Engine.standings(ms, ents, t.points);
    const lead = Engine.leader(table);
    const round = Engine.currentRound(ms);
    const today = U.today();
    const me = Store.me;

    const live = ms.filter(m => m.status==='live');
    const todays = ms.filter(m => m.match_date===today && m.status!=='live');
    const mine = me ? ms.filter(m => (m.player_a===me||m.player_b===me)
      && !['completed','cancelled'].includes(m.status))
      .sort((a,b)=> a.match_date.localeCompare(b.match_date))[0] : null;
    const needMe = me ? ms.filter(m => m.status==='pending_confirmation'
      && m.reported_by && m.reported_by !== me
      && (m.player_a===me||m.player_b===me)) : [];

    const played = ms.filter(m=>m.status==='completed').length;
    const goals = ms.filter(m=>m.status==='completed')
      .reduce((s,m)=> s + Number(m.score_a) + Number(m.score_b), 0);

    let h = '';

    /* لوحة العنوان */
    h += `<div class="card" style="background:linear-gradient(150deg,var(--surface),var(--bg-2));border-color:var(--gold-line)">
      <div class="eyebrow">البطولة الحالية</div>
      <div style="font-size:1.05rem;font-weight:900;margin:3px 0 10px">${U.esc(t.name)}</div>
      <div class="kpis">
        <div class="kpi"><b class="num">${round}</b><span>الجولة</span></div>
        <div class="kpi"><b class="num">${played}</b><span>لعبت</span></div>
        <div class="kpi"><b class="num">${ms.length - played}</b><span>متبقية</span></div>
        <div class="kpi"><b class="num">${goals}</b><span>هدف</span></div>
      </div>
    </div>`;

    /* تنبيه: نتيجة تنتظر تأكيدك */
    if(needMe.length){
      h += `<div class="card" style="border-color:rgba(139,123,255,.4);background:var(--violet-soft);margin-top:11px">
        <div style="font-size:.76rem;font-weight:900;color:var(--violet);margin-bottom:4px">
          ${needMe.length===1?'نتيجة تنتظر تأكيدك':`${needMe.length} نتائج تنتظر تأكيدك`}
        </div>
        <div class="tiny muted" style="margin-bottom:10px">لا تُعتمد النتيجة في الجدول قبل موافقتك.</div>
        ${needMe.map(m=>this.board(m,PM)).join('')}
      </div>`;
    }

    /* المتصدر */
    if(lead && lead.pld > 0){
      h += `<div class="sec"><h2>المتصدر</h2><div class="rule"></div><a class="more" href="#/table">الجدول كاملاً</a></div>
      <div class="card" style="display:flex;align-items:center;gap:12px">
        <div class="av me" style="width:40px;height:40px;font-size:1rem">🏆</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:.86rem">${U.esc(lead.name)}</div>
          <div class="tiny dim">${lead.pld} مباراة · ${lead.w} فوز · فارق <span class="sgn">${lead.gd>0?'+':''}${lead.gd}</span></div>
        </div>
        <div style="text-align:center"><div class="pts num" style="font-size:1.3rem">${lead.pts}</div><div class="tiny dim">نقطة</div></div>
      </div>`;
    }

    /* مباراتي القادمة */
    if(mine){
      h += `<div class="sec"><h2>مباراتي القادمة</h2><div class="rule"></div></div>${this.board(mine, PM)}`;
    } else if(!me){
      h += `<div class="note" style="margin-top:16px">حدّد اسمك من الأعلى لتتابع مبارياتك وتسجّل نتائجك.</div>`;
    }

    if(live.length){
      h += `<div class="sec"><h2>تُلعب الآن</h2><div class="rule"></div></div>${live.map(m=>this.board(m,PM)).join('')}`;
    }
    if(todays.length){
      h += `<div class="sec"><h2>مباريات اليوم</h2><div class="rule"></div></div>${todays.map(m=>this.board(m,PM)).join('')}`;
    }

    /* أفضل 5 */
    if(table.some(r=>r.pld>0)){
      h += `<div class="sec"><h2>أفضل 5 لاعبين</h2><div class="rule"></div></div>
      <div class="card"><table class="table"><tbody>
      ${table.slice(0,5).map(r=>`<tr class="${r.id===me?'me':''}">
        <td class="rank ${r.rank<=3?'top':''} num">${r.rank}</td>
        <td><div class="pl">${this.av(r.name, r.id===me)}<div class="nm">${U.esc(r.name)}</div></div></td>
        <td>${Engine.form(ms,r.id,5).length ? `<span class="form">${Engine.form(ms,r.id,5).reverse().map(f=>`<i class="fchip ${f}">${f==='W'?'ف':f==='D'?'ت':'خ'}</i>`).join('')}</span>` : '<span class="dim">—</span>'}</td>
        <td class="pts num">${r.pts}</td>
      </tr>`).join('')}
      </tbody></table></div>`;
    }

    return h;
  },

  async viewMatches(){
    const t = await Store.activeTournament();
    if(!t) return this.noTournament();
    const ms = await Store.matches(t.id);
    if(!ms.length) return this.noFixtures(t);
    const PM = await this.playersMap();
    const rounds = [...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);
    const cur = this.state.roundView || Engine.currentRound(ms);
    const list = ms.filter(m=>m.round===cur);
    const me = Store.me;

    return `
    <div class="sec" style="margin-top:4px"><h2>المباريات</h2><div class="rule"></div>
      <span class="tag">${rounds.length} جولة</span></div>
    <div class="rounds" id="rounds">
      ${rounds.map(r=>{
        const done = ms.filter(m=>m.round===r).every(m=>['completed','cancelled'].includes(m.status));
        return `<button class="rbtn ${r===cur?'on':''} ${done?'done':''}" onclick="UI.goRound(${r})">الجولة ${r}</button>`;
      }).join('')}
    </div>
    ${me ? `<div class="row tight" style="margin-bottom:11px">
      <button class="btn sm" onclick="UI.goMine()">مبارياتي فقط</button>
    </div>` : ''}
    ${list.map(m=>this.board(m,PM)).join('')}`;
  },

  goRound(r){
    this.state.roundView = r; this.render();
    setTimeout(()=>{ const el = document.querySelector('.rbtn.on'); el?.scrollIntoView({inline:'center',block:'nearest'}); },30);
  },
  async goMine(){
    const t = await Store.activeTournament();
    const ms = (await Store.matches(t.id)).filter(m=>m.player_a===Store.me||m.player_b===Store.me);
    const PM = await this.playersMap();
    this.sheet('مبارياتي', ms.length ? ms.map(m=>this.board(m,PM)).join('')
      : `<div class="empty"><p>لا توجد مباريات.</p></div>`);
  },

  async viewTable(){
    const t = await Store.activeTournament();
    if(!t) return this.noTournament();
    const ms = await Store.matches(t.id);
    const ents = await Store.entries(t.id);
    if(!ents.length) return this.noFixtures(t);
    const table = Engine.standings(ms, ents, t.points);
    const me = Store.me;

    return `
    <div class="sec" style="margin-top:4px"><h2>جدول الدوري</h2><div class="rule"></div>
      <span class="tag gold">${U.esc(t.name)}</span></div>
    <div class="card" style="padding:8px 10px">
      <table class="table">
        <thead><tr>
          <th>#</th><th>اللاعب</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th>
          <th>له</th><th>عليه</th><th>+/-</th><th>نقاط</th>
        </tr></thead>
        <tbody>
        ${table.map(r=>`<tr class="${r.id===me?'me':''}">
          <td class="rank ${r.rank<=3?'top':''} num">${r.rank}</td>
          <td><div class="pl">${this.av(r.name, r.id===me)}<div class="nm">${U.esc(r.name)}</div></div></td>
          <td class="num">${r.pld}</td><td class="num">${r.w}</td><td class="num">${r.d}</td><td class="num">${r.l}</td>
          <td class="num">${r.gf}</td><td class="num">${r.ga}</td>
          <td class="num" style="color:${r.gd>0?'var(--win)':r.gd<0?'var(--lose)':'var(--ink-3)'}"><span class="sgn">${r.gd>0?'+':''}${r.gd}</span></td>
          <td class="pts num">${r.pts}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="sec"><h2>الفورمة — آخر 5</h2><div class="rule"></div></div>
    <div class="card">
      ${table.map(r=>{
        const f = Engine.form(ms, r.id, 5).reverse();
        return `<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)">
          <div class="rank num dim">${r.rank}</div>
          <div class="nm" style="flex:1;font-size:.74rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(r.name)}</div>
          <span class="form">${f.length ? f.map(x=>`<i class="fchip ${x}">${x==='W'?'ف':x==='D'?'ت':'خ'}</i>`).join('')
            : '<i class="fchip N">—</i>'}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="note" style="margin-top:12px">كسر التعادل: النقاط ← فارق الأهداف ← الأهداف المسجلة ← المواجهة المباشرة.</div>`;
  },

  /* ── صفحة المباراة: دورة الحياة الكاملة ── */
  async viewMatch(id){
    const m = await Store.match(id);
    if(!m) return `<div class="empty"><h3>المباراة غير موجودة</h3><p>ربما حُذفت البطولة.</p><a class="btn" href="#/matches">كل المباريات</a></div>`;
    const t = await Store.tournament(m.tournament_id);
    const PM = await this.playersMap();
    const A = PM[m.player_a], B = PM[m.player_b];
    const me = Store.me, adm = Store.isAdmin;
    const isMine = me === m.player_a || me === m.player_b;
    const opp = me === m.player_a ? m.player_b : m.player_a;
    const st = CFG.STATUS[m.status];
    this._evd = (m.score_a != null) ? await Store.evidence(m.id) : [];

    let h = `<div class="sec" style="margin-top:4px">
      <a class="more" href="#/matches" style="font-size:.7rem">‹ المباريات</a>
      <div class="rule"></div><span class="tag">الجولة ${m.round}</span></div>`;

    /* اللوحة */
    h += `<div class="card" style="text-align:center;background:linear-gradient(150deg,var(--surface),var(--bg-2))">
      <div class="tag ${st.cls}" style="margin-bottom:12px">${m.status==='live'?'<i class="dot pulse"></i>':''}${st.ar}</div>
      <div class="board-grid" style="align-items:start">
        <div style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${this.av(A?.name, A?.id===me)}</div>
          <div style="font-size:.76rem;font-weight:800">${U.esc(A?.name||'—')}</div>
        </div>
        <div class="score" style="font-size:1.7rem;min-width:96px">
          ${m.score_a==null ? '<span class="dim" style="font-size:1rem">—</span>' : `${m.score_a} <span class="dim">–</span> ${m.score_b}`}
        </div>
        <div style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:6px">${this.av(B?.name, B?.id===me)}</div>
          <div style="font-size:.76rem;font-weight:800">${U.esc(B?.name||'—')}</div>
        </div>
      </div>
      <div class="tiny dim" style="margin-top:12px">${U.fmtDate(m.match_date)} · ${U.fmtTime(m.match_time)}</div>
      ${m.result_type==='walkover' ? `<div class="tag" style="margin-top:8px">فوز بالانسحاب</div>` : ''}
    </div>`;

    /* حضور اللاعبين */
    if(['scheduled','live'].includes(m.status)){
      h += `<div class="sec"><h2>حضور اللاعبين</h2><div class="rule"></div></div>
      <div class="card">
        <div style="display:flex;gap:10px">
          ${[[m.player_a,'attend_a'],[m.player_b,'attend_b']].map(([pid,key])=>`
            <div style="flex:1;text-align:center;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px">
              <div class="tiny" style="font-weight:800;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(PM[pid]?.name||'—')}</div>
              <div class="tag ${m[key]?'win':''}">${m[key]?'حاضر':'لم يؤكد'}</div>
            </div>`).join('')}
        </div>
        ${isMine && !m[me===m.player_a?'attend_a':'attend_b'] ?
          `<button class="btn ok full" style="margin-top:11px" onclick="UI.attend('${m.id}')">أكّد حضوري</button>` : ''}
        ${m.attend_a && m.attend_b && m.status==='scheduled' ?
          `<div class="note" style="margin-top:11px;margin-bottom:0">المباراة جاهزة للبدء.
            ${isMine||adm?`<button class="btn sm" style="margin-top:8px" onclick="UI.setStatus('${m.id}','live')">ابدأ المباراة</button>`:''}</div>` : ''}
      </div>`;
    }

    /* تسجيل النتيجة */
    if(['scheduled','live'].includes(m.status) && (isMine || adm)){
      h += `<div class="sec"><h2>تسجيل النتيجة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="entry">
          <div>
            <div class="who">${U.esc(A?.name||'—')}</div>
            <div class="stepper">
              <button onclick="UI.step('sa',1)">+</button>
              <input class="num" id="sa" type="number" inputmode="numeric" min="0" max="99" value="0">
              <button onclick="UI.step('sa',-1)">−</button>
            </div>
          </div>
          <div class="vs">VS</div>
          <div>
            <div class="who">${U.esc(B?.name||'—')}</div>
            <div class="stepper">
              <button onclick="UI.step('sb',1)">+</button>
              <input class="num" id="sb" type="number" inputmode="numeric" min="0" max="99" value="0">
              <button onclick="UI.step('sb',-1)">−</button>
            </div>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label>إثبات النتيجة <span class="dim">(اختياري)</span></label>
          <input class="input" type="file" accept="image/*" id="evd" onchange="UI.pickEvidence(event)">
          <div class="evd" id="evdprev"></div>
        </div>
        <button class="btn solid full" onclick="UI.report('${m.id}')">سجّل النتيجة</button>
        <div class="tiny dim center" style="margin-top:8px">تُرسل للخصم للموافقة قبل اعتمادها في الجدول.</div>
      </div>`;
    }

    /* تأكيد الخصم */
    if(m.status === 'pending_confirmation'){
      const reporter = PM[m.reported_by];
      const iMustConfirm = isMine && m.reported_by !== me;
      h += `<div class="sec"><h2>تأكيد النتيجة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="note violet">سجّل <b>${U.esc(reporter?.name||'—')}</b> النتيجة ${m.score_a} – ${m.score_b}
          ${m.reported_at?`<div class="tiny dim" style="margin-top:4px">${U.fmtStamp(m.reported_at)}</div>`:''}</div>
        ${this.evidenceHtml()}
        ${iMustConfirm ? `
          <div class="row" style="margin-top:11px">
            <button class="btn ok" style="flex:1" onclick="UI.confirm('${m.id}')">أوافق</button>
            <button class="btn danger" style="flex:1" onclick="UI.disputeSheet('${m.id}')">أعترض</button>
          </div>`
        : `<div class="tiny dim center" style="margin-top:10px">
            بانتظار موافقة ${U.esc(PM[m.reported_by===m.player_a?m.player_b:m.player_a]?.name||'الخصم')}.
          </div>
          ${adm?`<button class="btn full" style="margin-top:10px" onclick="UI.confirm('${m.id}',true)">اعتماد إداري</button>`:''}`}
      </div>`;
    }

    /* نزاع */
    if(m.status === 'disputed'){
      h += `<div class="sec"><h2>نزاع على المباراة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="note warn">اللاعبان سجّلا نتيجتين مختلفتين. القرار للإدارة.</div>
        <div class="row" style="gap:9px">
          ${[['reported','النتيجة الأولى',m.score_a,m.score_b,m.reported_by],
             ['claim','اعتراض الخصم',m.claim_a,m.claim_b,m.claim_by]].map(([k,lbl,x,y,by])=>`
            <div style="flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center">
              <div class="tiny dim" style="font-weight:800">${lbl}</div>
              <div class="num" style="font-size:1.2rem;font-weight:800;margin:4px 0">${x} – ${y}</div>
              <div class="tiny dim">${U.esc(PM[by]?.name||'—')}</div>
              ${adm?`<button class="btn sm" style="margin-top:7px" onclick="UI.resolve('${m.id}','${k}')">اعتماد</button>`:''}
            </div>`).join('')}
        </div>
        ${this.evidenceHtml()}
        ${adm?`<div class="row" style="margin-top:11px">
          <button class="btn" style="flex:1" onclick="UI.replay('${m.id}')">إعادة المباراة</button>
          <button class="btn danger" style="flex:1" onclick="UI.setStatus('${m.id}','cancelled')">إلغاء</button>
        </div>`:`<div class="tiny dim center" style="margin-top:10px">بانتظار قرار الإدارة.</div>`}
      </div>`;
    }

    /* مكتملة */
    if(m.status === 'completed'){
      h += `<div class="card">
        <div class="tiny dim">اعتُمدت ${U.fmtStamp(m.confirmed_at)}${m.confirmed_by_admin?' — بقرار إداري':''}</div>
        ${this.evidenceHtml()}
        ${adm?`<button class="btn full" style="margin-top:11px" onclick="UI.reopen('${m.id}')">إعادة فتح النتيجة</button>`:''}
      </div>`;
    }

    /* التأجيل */
    if(!['completed','cancelled'].includes(m.status)){
      h += `<div class="sec"><h2>التأجيل</h2><div class="rule"></div></div><div class="card">`;
      if(m.postpone && !m.postpone.agreed){
        const byMe = m.postpone.by === me;
        h += `<div class="note">طلب <b>${U.esc(PM[m.postpone.by]?.name||'—')}</b> التأجيل إلى
          ${U.fmtDate(m.postpone.date)} ${U.fmtTime(m.postpone.time)}</div>`;
        if(isMine && !byMe)
          h += `<div class="row"><button class="btn ok" style="flex:1" onclick="UI.agreePostpone('${m.id}')">أوافق على التأجيل</button>
                <button class="btn danger" style="flex:1" onclick="UI.rejectPostpone('${m.id}')">أرفض</button></div>`;
        else h += `<div class="tiny dim center">بانتظار موافقة الخصم.</div>`;
        if(adm) h += `<button class="btn full" style="margin-top:9px" onclick="UI.agreePostpone('${m.id}',true)">تأجيل إداري</button>`;
      } else if(isMine || adm){
        h += `<button class="btn full" onclick="UI.postponeSheet('${m.id}')">اطلب تأجيل المباراة</button>
              <div class="tiny dim center" style="margin-top:7px">يُنفَّذ فوراً عند موافقة الطرفين.</div>`;
      } else {
        h += `<div class="tiny dim center">لا توجد طلبات تأجيل.</div>`;
      }
      h += `</div>`;
    }

    /* إجراءات الإدارة */
    if(adm){
      h += `<div class="sec"><h2>إجراءات الإدارة</h2><div class="rule"></div></div>
      <div class="card"><div class="row tight">
        <button class="btn sm" onclick="UI.walkoverSheet('${m.id}')">فوز بالانسحاب</button>
        <button class="btn sm" onclick="UI.rescheduleSheet('${m.id}')">تعديل الموعد</button>
        ${m.status!=='cancelled'?`<button class="btn sm danger" onclick="UI.setStatus('${m.id}','cancelled')">إلغاء المباراة</button>`:
          `<button class="btn sm" onclick="UI.replay('${m.id}')">إعادة تفعيل</button>`}
      </div></div>`;
    }

    /* سجل المباراة */
    const logs = await Store.auditLog(m.tournament_id, m.id);
    if(logs.length){
      h += `<div class="sec"><h2>سجل المباراة</h2><div class="rule"></div></div>
      <div class="card">${logs.map(l=>`<div class="log">
        <time>${U.fmtStamp(l.created_at)}</time>
        <div><b>${U.esc(l.actor_name)}</b> — ${U.esc(l.action)}${l.detail?` <span class="dim">${U.esc(l.detail)}</span>`:''}</div>
      </div>`).join('')}</div>`;
    }
    return h;
  },

  _evd: [],
  evidenceHtml(){
    if(!this._evd.length) return '';
    return `<div class="evd">${this._evd.map((e,i)=>
      `<img src="${e.image}" alt="إثبات ${i+1}" onclick="UI.zoom(${i})">`).join('')}</div>`;
  },
  zoom(i){
    this.sheet('إثبات النتيجة',
      `<img src="${this._evd[i].image}" style="width:100%;border-radius:12px" alt="إثبات">`);

  /* ═══════════ الإدارة ═══════════ */
  async viewAdmin(){
    if(!Store.isAdmin){
      return `<div class="sec" style="margin-top:4px"><h2>الإدارة</h2><div class="rule"></div></div>
      <div class="card">
        <div class="empty" style="padding:20px 6px">
          <h3>${Store.session ? 'حسابك ليس حساب إدارة' : 'سجّل دخولك أولاً'}</h3>
          <p>${Store.session
            ? 'صلاحية الإدارة تُمنح من لوحة Supabase.'
            : 'إدارة البطولات تتطلب حساباً بصلاحية إدارة.'}</p>
          ${Store.session ? '' : '<button class="btn solid" onclick="UI.identitySheet()">تسجيل الدخول</button>'}
        </div>
        ${Store.session ? `<div class="note" dir="ltr" style="text-align:left;font-family:monospace;font-size:.62rem">
          update public.profiles set is_admin = true<br>where username = '${U.esc(Store.profile?.username||'')}';
        </div>` : ''}
      </div>`;
    }
    const t = await Store.activeTournament();
    const list = await Store.tournaments();
    const players = await Store.players();
    let h = `<div class="sec" style="margin-top:4px"><h2>الإدارة</h2><div class="rule"></div>
      <span class="tag gold">${U.esc(Store.profile?.display_name||'')}</span></div>`;

    h += `<div class="card">
      <div class="row tight">
        <button class="btn sm solid" onclick="UI.tournamentForm()">بطولة جديدة</button>
        <button class="btn sm" onclick="UI.playersSheet()">اللاعبون (${players.length})</button>
        ${t?`<button class="btn sm" onclick="UI.entriesSheet()">مشاركو البطولة</button>`:''}
      </div>
    </div>`;

    if(t){
      const ms = await Store.matches(t.id);
      const ents = await Store.entries(t.id);
      const disputes = ms.filter(m=>m.status==='disputed');
      const pending = ms.filter(m=>m.status==='pending_confirmation');
      const total = t.format==='double' ? ents.length*(ents.length-1) : ents.length*(ents.length-1)/2;
      const rounds = ents.length ? (t.format==='double' ? (ents.length%2?ents.length:ents.length-1)*2 : (ents.length%2?ents.length:ents.length-1)) : 0;

      h += `<div class="sec"><h2>${U.esc(t.name)}</h2><div class="rule"></div>
        <span class="tag ${t.status==='active'?'win':''}">${t.status==='active'?'جارية':'مسودة'}</span></div>
      <div class="card">
        <div class="kpis" style="margin-bottom:12px">
          <div class="kpi"><b class="num">${ents.length}</b><span>لاعب</span></div>
          <div class="kpi"><b class="num">${rounds}</b><span>جولة</span></div>
          <div class="kpi"><b class="num">${total}</b><span>مباراة</span></div>
          <div class="kpi"><b class="num">${ms.filter(m=>m.status==='completed').length}</b><span>مكتملة</span></div>
        </div>
        ${ents.length < 2 ? `<div class="note warn">أضف لاعبين للبطولة أولاً.</div>` :
          !ms.length ? `<button class="btn solid full" onclick="UI.generate()">توليد جدول المباريات</button>` :
          `<div class="row tight">
            <button class="btn sm danger" onclick="UI.regenerate()">إعادة توليد الجدول</button>
            <button class="btn sm" onclick="UI.tournamentForm('${t.id}')">تعديل البطولة</button>
            <button class="btn sm danger" onclick="UI.dropTournament('${t.id}')">حذف البطولة</button>
          </div>`}
      </div>`;

      if(disputes.length){
        const PM = await this.playersMap();
        h += `<div class="sec"><h2>نزاعات مفتوحة</h2><div class="rule"></div>
          <span class="tag" style="color:var(--lose)">${disputes.length}</span></div>
          ${disputes.map(m=>this.board(m,PM)).join('')}`;
      }
      if(pending.length){
        const PM = await this.playersMap();
        h += `<div class="sec"><h2>بانتظار التأكيد</h2><div class="rule"></div>
          <span class="tag violet">${pending.length}</span></div>
          ${pending.map(m=>this.board(m,PM)).join('')}`;
      }

      const logs = (await Store.auditLog(t.id)).slice(0,25);
      if(logs.length){
        h += `<div class="sec"><h2>سجل التدقيق</h2><div class="rule"></div></div>
        <div class="card">${logs.map(l=>`<div class="log">
          <time>${U.fmtStamp(l.created_at)}</time>
          <div><b>${U.esc(l.actor_name)}</b> — ${U.esc(l.action)}${l.detail?` <span class="dim">${U.esc(l.detail)}</span>`:''}</div>
        </div>`).join('')}</div>`;
      }
    }

    if(list.length > 1){
      h += `<div class="sec"><h2>كل البطولات</h2><div class="rule"></div></div><div class="card">
        ${list.map(x=>`<button class="pick ${x.id===t?.id?'on':''}" onclick="UI.pickTournament('${x.id}')">
          <div class="av">${x.format==='double'?'⇄':'→'}</div>
          <div class="nm">${U.esc(x.name)}<div class="tiny dim" style="font-weight:700">${U.fmtDate(x.start_date)}</div></div>
        </button>`).join('')}</div>`;
    }

    h += `<div class="card" style="margin-top:14px">
      <div class="tiny dim">البيانات محفوظة في Supabase ومتزامنة بين كل الأجهزة.</div>
    </div>`;
    return h;
  },

  /* ═══════════ الإجراءات ═══════════ */
  step(id, d){
    const el = document.getElementById(id);
    el.value = Math.max(0, Math.min(99, (Number(el.value)||0) + d));
  },

  _evidence: [],
  async pickEvidence(ev){
    const f = ev.target.files[0]; if(!f) return;
    try{
      const src = await this.compress(f);
      this._evidence = [src];
      document.getElementById('evdprev').innerHTML = `<img src="${src}" alt="إثبات">`;
    }catch(e){ this.toast('تعذّر قراءة الصورة','err'); }
  },
  compress(file){
    return new Promise((res,rej)=>{
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 900, sc = Math.min(1, max/Math.max(img.width,img.height));
          const c = document.createElement('canvas');
          c.width = img.width*sc; c.height = img.height*sc;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg', .6));
        };
        img.onerror = rej; img.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  },

  async attend(id){
    const m = await Store.match(id);
    const key = Store.me === m.player_a ? 'attend_a' : 'attend_b';
    await Store.updateMatch(id, {[key]: true});
    await Store.log(m.tournament_id, id, 'تأكيد الحضور');
    this.render(); this.toast('تم تأكيد حضورك','ok');
  },

  async setStatus(id, status){
    const m = await Store.match(id);
    await Store.updateMatch(id, {status});
    await Store.log(m.tournament_id, id, 'تغيير الحالة', CFG.STATUS[status]?.ar || status);
    this.render(); this.toast('تم التحديث','ok');
  },

  async report(id){
    const sa = Number(document.getElementById('sa').value);
    const sb = Number(document.getElementById('sb').value);
    if(!Number.isInteger(sa) || !Number.isInteger(sb) || sa<0 || sb<0)
      return this.toast('أدخل نتيجة صحيحة','err');
    const m = await Store.match(id);
    const by = Store.isAdmin && !(Store.me===m.player_a||Store.me===m.player_b) ? m.player_a : Store.me;
    if(!by) return this.toast('حدّد اسمك أولاً','err');
    await Store.updateMatch(id, {
      score_a: sa, score_b: sb, status: 'pending_confirmation',
      result_type: 'normal',
      reported_by: by, reported_at: U.nowISO(), result_at: U.nowISO()
    });
    if(this._evidence.length){ await Store.addEvidence(id, this._evidence); }
    this._evidence = [];
    await Store.log(m.tournament_id, id, 'تسجيل النتيجة', `${sa} – ${sb}`);
    this.render(); this.toast('سُجّلت — بانتظار تأكيد الخصم','ok');
  },

  async confirm(id, byAdmin){
    const m = await Store.match(id);
    await Store.updateMatch(id, {
      status:'completed', confirmed_by: Store.me, confirmed_by_admin: !!byAdmin,
      confirmed_at: U.nowISO(), result_at: m.result_at || U.nowISO()
    });
    await Store.log(m.tournament_id, id, byAdmin?'اعتماد إداري للنتيجة':'تأكيد النتيجة', `${m.score_a} – ${m.score_b}`);
    this.render(); this.toast('اعتُمدت النتيجة','ok');
  },

    const m = await Store.match(id); const PM = await this.playersMap();
    this.sheet('اعتراض على النتيجة', `
      <div class="note warn">أدخل النتيجة التي تراها صحيحة. ستنتقل المباراة إلى الإدارة للفصل.</div>
      <div class="entry">
        <div><div class="who">${U.esc(PM[m.player_a]?.name)}</div>
          <div class="stepper"><button onclick="UI.step('ca',1)">+</button>
          <input class="num" id="ca" type="number" min="0" value="${m.score_a}">
          <button onclick="UI.step('ca',-1)">−</button></div></div>
        <div class="vs">VS</div>
        <div><div class="who">${U.esc(PM[m.player_b]?.name)}</div>
          <div class="stepper"><button onclick="UI.step('cb',1)">+</button>
          <input class="num" id="cb" type="number" min="0" value="${m.score_b}">
          <button onclick="UI.step('cb',-1)">−</button></div></div>
      </div>
      <button class="btn danger full" style="margin-top:12px" onclick="UI.dispute('${id}')">أرسل الاعتراض</button>`);
  },
  async dispute(id){
    const ca = Number(document.getElementById('ca').value);
    const cb = Number(document.getElementById('cb').value);
    const m = await Store.match(id);
    await Store.updateMatch(id, { status:'disputed', claim_a:ca, claim_b:cb, claim_by:Store.me, claim_at:U.nowISO() });
    await Store.log(m.tournament_id, id, 'اعتراض على النتيجة', `${ca} – ${cb}`);
    this.closeSheet(); this.render(); this.toast('سُجّل الاعتراض — بانتظار الإدارة','err');
  },
  async resolve(id, which){
    const m = await Store.match(id);
    const a = which==='claim' ? m.claim_a : m.score_a;
    const b = which==='claim' ? m.claim_b : m.score_b;
    await Store.updateMatch(id, { score_a:a, score_b:b, status:'completed',
      confirmed_by:Store.me, confirmed_by_admin:true,
      confirmed_at:U.nowISO(), result_at:U.nowISO() });
    await Store.log(m.tournament_id, id, 'حسم النزاع', `اعتماد ${a} – ${b}`);
    this.render(); this.toast('حُسم النزاع','ok');
  },
  async replay(id){
    const m = await Store.match(id);
    await Store.updateMatch(id, { status:'scheduled', score_a:null, score_b:null,
      reported_by:null, reported_at:null, confirmed_by:null, confirmed_at:null,
      claim_a:null, claim_b:null, claim_by:null, result_type:null, result_at:null,
      confirmed_by_admin:false, attend_a:false, attend_b:false });
    await Store.log(m.tournament_id, id, 'إعادة المباراة');
    this.render(); this.toast('أُعيدت المباراة للجدول','ok');
  },
  async reopen(id){
    const m = await Store.match(id);
    await Store.updateMatch(id, { status:'pending_confirmation', confirmed_by:null, confirmed_at:null });
    await Store.log(m.tournament_id, id, 'إعادة فتح النتيجة');
    this.render(); this.toast('أُعيد فتح النتيجة','ok');
  },

  async postponeSheet(id){
    const m = await Store.match(id);
    this.sheet('طلب تأجيل', `
      <div class="note">يُنفَّذ التأجيل مباشرة عند موافقة الطرفين. الموعد القديم يبقى في السجل.</div>
      <div class="field"><label>الموعد الجديد</label>
        <input class="input" id="pd" type="date" value="${m.match_date}"></div>
      <div class="field"><label>الوقت</label>
        <input class="input" id="pt" type="time" value="${m.match_time}"></div>
      <button class="btn solid full" onclick="UI.requestPostpone('${id}')">أرسل الطلب</button>`);
  },
  async requestPostpone(id){
    const d = document.getElementById('pd').value, tm = document.getElementById('pt').value;
    if(!d) return this.toast('اختر تاريخاً','err');
    const m = await Store.match(id);
    await Store.updateMatch(id, { postpone:{ by:Store.me, date:d, time:tm||m.match_time, agreed:false } });
    await Store.log(m.tournament_id, id, 'طلب تأجيل', `إلى ${U.fmtDate(d)}`);
    this.closeSheet(); this.render(); this.toast('أُرسل الطلب للخصم','ok');
  },
  async agreePostpone(id, byAdmin){
    const m = await Store.match(id);
    const p = m.postpone; if(!p) return;
    await Store.updateMatch(id, {
      match_date:p.date, match_time:p.time, status:'scheduled',
      postpone:{...p, agreed:true, agreed_at:U.nowISO()},
      history:[...(m.history||[]), {from:m.match_date, to:p.date, at:U.nowISO()}]
    });
    await Store.log(m.tournament_id, id, byAdmin?'تأجيل إداري':'الموافقة على التأجيل',
      `من ${U.fmtDate(m.match_date)} إلى ${U.fmtDate(p.date)}`);
    this.render(); this.toast('أُجّلت المباراة','ok');
  },
  async rejectPostpone(id){
    const m = await Store.match(id);
    await Store.updateMatch(id, { postpone:null });
    await Store.log(m.tournament_id, id, 'رفض التأجيل');
    this.render(); this.toast('رُفض الطلب','err');
  },

    this.sheet('فوز بالانسحاب', `

        <div class="nm">فوز ${U.esc(PM[m.player_a]?.name)}</div></button>
      <button class="pick" onclick="UI.walkover('${id}','b')">${this.av(PM[m.player_b]?.name)}
        <div class="nm">فوز ${U.esc(PM[m.player_b]?.name)}</div></button>`);

  async walkover(id, side){

    await Store.updateMatch(id, {
      score_a: side==='a'?3:0, score_b: side==='b'?3:0,

      confirmed_at:U.nowISO(), result_at:U.nowISO()
    });
    await Store.log(m.tournament_id, id, 'تسجيل فوز بالانسحاب',
      `لصالح ${PM[side==='a'?m.player_a:m.player_b]?.name||''}`);

    this.sheet('تعديل الموعد', `
      <div class="field"><label>التاريخ</label><input class="input" id="rd" type="date" value="${m.match_date}"></div>
      <div class="field"><label>الوقت</label><input class="input" id="rt" type="time" value="${m.match_time}"></div>
      <button class="btn solid full" onclick="UI.reschedule('${id}')">حفظ الموعد</button>`);

  async reschedule(id){
    const d = document.getElementById('rd').value, tm = document.getElementById('rt').value;
    const m = await Store.match(id);
    await Store.updateMatch(id, { match_date:d, match_time:tm,

    this.closeSheet(); this.render(); this.toast('حُدّث الموعد','ok');
  },

  async tournamentForm(id){
